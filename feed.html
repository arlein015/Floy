<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Feed</title>
    <style>
        /* Styles identiques à index.html pour le feed */
        .post {
            margin-bottom: 20px;
            background: #000000;
            border: 1px solid #262626;
            border-radius: 8px;
        }
        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }
        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .post-image {
            width: 100%;
            display: block;
        }
        .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        .action-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #f5f5f5;
        }
        .action-btn.liked svg {
            fill: #FF6B35;
            stroke: #FF6B35;
        }
        .save-btn {
            margin-left: auto;
        }
        .post-likes {
            font-weight: 600;
            padding: 0 16px 8px;
        }
        .post-caption {
            padding: 0 16px 8px;
        }
        .post-comments {
            padding: 0 16px 4px;
            color: #8e8e8e;
            cursor: pointer;
        }
        .post-time {
            padding: 4px 16px 12px;
            color: #8e8e8e;
            font-size: 10px;
        }
        .comment-form {
            display: flex;
            padding: 8px 16px;
            border-top: 1px solid #262626;
        }
        .comment-input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 12px 0;
            outline: none;
        }
        .comment-post-btn {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="feed-container"></div>
    
    <script>
        // Ce script charge le feed depuis localStorage
        function loadFeed() {
            const posts = JSON.parse(localStorage.getItem('floy_posts') || '[]');
            const container = document.getElementById('feed-container');
            
            if (posts.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:60px;color:#8e8e8e;">📸 Aucune publication</div>';
                return;
            }
            
            container.innerHTML = posts.map(post => `
                <div class="post">
                    <div class="post-header">
                        <div class="post-user">
                            <div class="post-avatar">${post.avatar || '👤'}</div>
                            <div><strong>${post.username}</strong></div>
                        </div>
                    </div>
                    <img class="post-image" src="${post.imageUrl}" alt="Post">
                    <div class="post-actions">
                        <button class="action-btn">❤️</button>
                        <button class="action-btn">💬</button>
                        <button class="action-btn">📤</button>
                        <button class="action-btn save-btn">🔖</button>
                    </div>
                    <div class="post-likes">${post.likes || 0} likes</div>
                    <div class="post-caption"><strong>${post.username}</strong> ${post.caption || ''}</div>
                    <div class="post-time">À l'instant</div>
                    <div class="comment-form">
                        <input type="text" class="comment-input" placeholder="Ajouter un commentaire...">
                        <button class="comment-post-btn">Publier</button>
                    </div>
                </div>
            `).join('');
        }
        
        loadFeed();
    </script>
</body>
</html>
