<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Profil</title>
    <link rel="stylesheet" href="profil.css">
</head>
<body>
    <!-- Header -->
    <div class="profile-header">
        <button class="back-btn" onclick="goBack()">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <div class="profile-username" id="headerUsername">chargement...</div>
        <button class="menu-btn" id="menuBtn">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="2.5"/>
                <circle cx="19" cy="12" r="2.5"/>
                <circle cx="5" cy="12" r="2.5"/>
            </svg>
        </button>
    </div>

    <!-- Menu dropdown -->
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-item" onclick="goToSettings()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="2.5"/>
                <path d="M18.37 7.29l1.06-1.06a1.5 1.5 0 0 0-2.12-2.12L15.7 6.12a7.5 7.5 0 0 0-7.4 0L6.69 4.11a1.5 1.5 0 1 0-2.12 2.12l1.06 1.06a7.5 7.5 0 0 0 0 7.4l-1.06 1.06a1.5 1.5 0 0 0 2.12 2.12l1.06-1.06a7.5 7.5 0 0 0 7.4 0l1.06 1.06a1.5 1.5 0 0 0 2.12-2.12l-1.06-1.06a7.5 7.5 0 0 0 0-7.4z"/>
            </svg>
            <span>Paramètres</span>
        </div>
        <div class="dropdown-item" onclick="logout()">
            <svg viewBox="0 0 24 24">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
            </svg>
            <span>Déconnexion</span>
        </div>
    </div>

    <!-- Contenu principal -->
    <div class="profile-container">
        <div id="profileContent">
            <div class="loader">
                <div class="spinner"></div>
                <p>Chargement du profil...</p>
            </div>
        </div>
    </div>

    <!-- MODAL CHANGER AVATAR -->
    <div id="avatarModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Modifier la photo</h3>
                <button class="modal-close" onclick="closeAvatarModal()">&times;</button>
            </div>
            <div class="modal-body">
                <button class="avatar-option" onclick="changeAvatarByEmoji()">
                    <span>😊</span> Changer avec un emoji
                </button>
                <button class="avatar-option" onclick="changeAvatarByLetter()">
                    <span>🔤</span> Changer avec une lettre
                </button>
                <button class="avatar-option avatar-remove" onclick="removeAvatar()">
                    <span>🗑️</span> Supprimer la photo
                </button>
            </div>
        </div>
    </div>

    <script src="profil.js"></script>
</body>
</html>
