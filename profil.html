<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floy - Profil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }
        .profile-header {
            position: sticky;
            top: 0;
            background: #000000;
            border-bottom: 1px solid #262626;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: white;
        }
        .profile-username {
            font-size: 20px;
            font-weight: 600;
        }
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-info {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .profile-stats {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-weight: 700;
            font-size: 18px;
        }
        .stat-label {
            color: #8e8e8e;
            font-size: 12px;
        }
        .profile-bio {
            margin-top: 16px;
        }
        .edit-profile-btn {
            background: #1a1a1a;
            border: 1px solid #262626;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
        }
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 20px;
        }
        .post-item {
            aspect-ratio: 1;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .loader {
            text-align: center;
            padding: 60px;
            color: #8e8e8e;
        }
        @media (max-width: 600px) {
            .profile-container { padding: 12px; }
            .profile-info { gap: 20px; }
            .profile-avatar { width: 60px; height: 60px; font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="profile-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <div class="profile-username" id="profileUsername">chargement...</div>
    </div>

    <div class="profile-container">
        <div id="profileContent">
            <div class="loader">📱 Chargement du profil...</div>
        </div>
    </div>

    <script>
        let currentUser = {
            id: 1,
            username: "floy_user",
            fullname: "Floy Creator",
            avatar: "F",
            bio: "Créateur de Floy 🔥",
            postsCount: 0,
            followers: 128,
            following: 94
        };

        function loadProfile() {
            const saved = localStorage.getItem('floy_user');
            if (saved) {
                currentUser = { ...currentUser, ...JSON.parse(saved) };
            }
            
            const posts = JSON.parse(localStorage.getItem('floy_posts') || '[]');
            const userPosts = posts.filter(p => p.userId === currentUser.id);
            
            document.getElementById('profileUsername').textContent = currentUser.username;
            
            document.getElementById('profileContent').innerHTML = `
                <div class="profile-info">
                    <div class="profile-avatar" onclick="changeAvatar()">${currentUser.avatar}</div>
                    <div class="profile-details">
                        <div class="profile-stats">
                            <div class="stat"><div class="stat-number">${userPosts.length}</div><div class="stat-label">posts</div></div>
                            <div class="stat"><div class="stat-number">${currentUser.followers}</div><div class="stat-label">abonnés</div></div>
                            <div class="stat"><div class="stat-number">${currentUser.following}</div><div class="stat-label">abonnements</div></div>
                        </div>
                        <div class="profile-bio">
                            <strong>${currentUser.fullname}</strong><br>
                            ${currentUser.bio}
                        </div>
                        <button class="edit-profile-btn" onclick="editProfile()">Modifier le profil</button>
                    </div>
                </div>
                <div class="posts-grid" id="postsGrid">
                    ${userPosts.map(p => `<div class="post-item" onclick="alert('Post #${p.id}')">📷</div>`).join('') || '<div class="loader" style="grid-column:span 3">Aucune publication</div>'}
                </div>
            `;
        }

        function changeAvatar() {
            const newAvatar = prompt("Nouvel avatar (1 lettre ou emoji):", currentUser.avatar);
            if (newAvatar && newAvatar.length >= 1) {
                currentUser.avatar = newAvatar;
                localStorage.setItem('floy_user', JSON.stringify(currentUser));
                loadProfile();
            }
        }

        function editProfile() {
            const newUsername = prompt("Nouveau nom d'utilisateur:", currentUser.username);
            if (newUsername) currentUser.username = newUsername;
            const newFullname = prompt("Nom complet:", currentUser.fullname);
            if (newFullname) currentUser.fullname = newFullname;
            const newBio = prompt("Bio:", currentUser.bio);
            if (newBio) currentUser.bio = newBio;
            localStorage.setItem('floy_user', JSON.stringify(currentUser));
            loadProfile();
        }

        loadProfile();
    </script>
</body>
</html>
