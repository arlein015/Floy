<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Profil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }

        /* Header avec flèche retour */
        .profile-header {
            position: sticky;
            top: 0;
            background: #000000;
            z-index: 100;
            padding: 12px 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .profile-username {
            font-size: 20px;
            font-weight: 700;
        }

        /* Container principal */
        .profile-container {
            max-width: 935px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Section header du profil (avatar + stats) */
        .profile-info {
            display: flex;
            gap: 60px;
            padding: 30px 0 40px;
            border-bottom: 1px solid #262626;
        }

        /* Avatar */
        .profile-avatar-section {
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #FF6B35, #FF9F5C);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .profile-avatar:hover {
            opacity: 0.8;
        }

        .profile-avatar-inner {
            width: 142px;
            height: 142px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 600;
            color: #FF6B35;
        }

        /* Infos */
        .profile-details {
            flex: 1;
        }

        .profile-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 400;
        }

        .edit-profile-btn {
            background: #1a1a1a;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .edit-profile-btn:hover {
            background: #262626;
        }

        .settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
        }

        /* Stats */
        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: left;
        }

        .stat-number {
            font-weight: 700;
            font-size: 16px;
        }

        .stat-label {
            color: #8e8e8e;
            font-size: 14px;
        }

        /* Bio */
        .profile-bio {
            margin-top: 16px;
        }

        .bio-fullname {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .bio-text {
            margin-bottom: 4px;
            font-size: 14px;
        }

        .bio-link {
            color: #FF6B35;
            text-decoration: none;
            font-size: 14px;
        }

        /* Tabs (grille / reels / tagged) */
        .profile-tabs {
            display: flex;
            justify-content: center;
            gap: 60px;
            border-bottom: 1px solid #262626;
            margin-top: 20px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 0;
            cursor: pointer;
            color: #8e8e8e;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }

        .tab svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: currentColor;
        }

        .tab.active {
            color: #FF6B35;
            border-bottom-color: #FF6B35;
        }

        /* Grille des posts */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 4px;
        }

        .post-item {
            aspect-ratio: 1;
            background: #1a1a1a;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .post-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .post-item:hover .post-overlay {
            opacity: 1;
        }

        .overlay-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-weight: 600;
        }

        .overlay-item svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* Modal modification profil */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #000000;
            border-radius: 16px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #262626;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-field {
            margin-bottom: 20px;
        }

        .modal-field label {
            display: block;
            color: #8e8e8e;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .modal-field input, .modal-field textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .modal-field input:focus, .modal-field textarea:focus {
            border-color: #FF6B35;
        }

        .modal-field textarea {
            resize: none;
            height: 80px;
        }

        .save-profile-btn {
            width: 100%;
            background: #FF6B35;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Loader */
        .loader {
            text-align: center;
            padding: 60px;
            color: #8e8e8e;
        }

        /* Responsive */
        @media (max-width: 735px) {
            .profile-info {
                gap: 20px;
                padding: 20px 0;
            }
            .profile-avatar {
                width: 77px;
                height: 77px;
            }
            .profile-avatar-inner {
                width: 71px;
                height: 71px;
                font-size: 28px;
            }
            .profile-stats {
                gap: 20px;
            }
            .profile-tabs {
                gap: 30px;
            }
            .tab span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header avec retour -->
    <div class="profile-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <div class="profile-username" id="headerUsername">chargement...</div>
    </div>

    <div class="profile-container">
        <div id="profileContent">
            <div class="loader">
                <div>📱 Chargement du profil...</div>
            </div>
        </div>
    </div>

    <!-- MODAL MODIFICATION PROFIL -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Modifier le profil</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="editUsername" placeholder="username">
                </div>
                <div class="modal-field">
                    <label>Nom complet</label>
                    <input type="text" id="editFullname" placeholder="Nom complet">
                </div>
                <div class="modal-field">
                    <label>Bio</label>
                    <textarea id="editBio" placeholder="Votre bio..."></textarea>
                </div>
                <div class="modal-field">
                    <label>Site web</label>
                    <input type="text" id="editWebsite" placeholder="https://...">
                </div>
                <button class="save-profile-btn" onclick="saveProfile()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // ========== DONNÉES UTILISATEUR ==========
        let currentUser = {
            id: 1,
            username: "floy_user",
            fullname: "Floy Creator",
            avatar: "F",
            bio: "Créateur de Floy 🔥 Passionné de design orange et noir",
            website: "floy.app",
            postsCount: 0,
            followers: 128,
            following: 94
        };

        // ========== POSTS DE L'UTILISATEUR ==========
        let userPosts = [
            {
                id: 1,
                imageUrl: "https://picsum.photos/400/400?random=1",
                likes: 124,
                comments: 8
            },
            {
                id: 2,
                imageUrl: "https://picsum.photos/400/400?random=2",
                likes: 89,
                comments: 5
            },
            {
                id: 3,
                imageUrl: "https://picsum.photos/400/400?random=3",
                likes: 234,
                comments: 12
            },
            {
                id: 4,
                imageUrl: "https://picsum.photos/400/400?random=4",
                likes: 56,
                comments: 3
            },
            {
                id: 5,
                imageUrl: "https://picsum.photos/400/400?random=5",
                likes: 78,
                comments: 7
            },
            {
                id: 6,
                imageUrl: "https://picsum.photos/400/400?random=6",
                likes: 145,
                comments: 15
            }
        ];

        // Mettre à jour le compteur
        currentUser.postsCount = userPosts.length;

        // ========== CHARGER LE PROFIL ==========
        function loadProfile() {
            const container = document.getElementById('profileContent');
            document.getElementById('headerUsername').textContent = currentUser.username;
            
            container.innerHTML = `
                <div class="profile-info">
                    <div class="profile-avatar-section">
                        <div class="profile-avatar" onclick="changeAvatar()">
                            <div class="profile-avatar-inner">${currentUser.avatar}</div>
                        </div>
                    </div>
                    <div class="profile-details">
                        <div class="profile-actions">
                            <div class="profile-name">${currentUser.username}</div>
                            <button class="edit-profile-btn" onclick="openEditModal()">Modifier le profil</button>
                            <button class="settings-btn" onclick="openSettings()">
                                <svg viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="2.5"/>
                                    <path d="M18.37 7.29l1.06-1.06a1.5 1.5 0 0 0-2.12-2.12L15.7 6.12a7.5 7.5 0 0 0-7.4 0L6.69 4.11a1.5 1.5 0 1 0-2.12 2.12l1.06 1.06a7.5 7.5 0 0 0 0 7.4l-1.06 1.06a1.5 1.5 0 0 0 2.12 2.12l1.06-1.06a7.5 7.5 0 0 0 7.4 0l1.06 1.06a1.5 1.5 0 0 0 2.12-2.12l-1.06-1.06a7.5 7.5 0 0 0 0-7.4z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="profile-stats">
                            <div class="stat">
                                <div class="stat-number">${currentUser.postsCount}</div>
                                <div class="stat-label">publications</div>
                            </div>
                            <div class="stat">
                                <div class="stat-number">${currentUser.followers}</div>
                                <div class="stat-label">abonnés</div>
                            </div>
                            <div class="stat">
                                <div class="stat-number">${currentUser.following}</div>
                                <div class="stat-label">abonnements</div>
                            </div>
                        </div>
                        <div class="profile-bio">
                            <div class="bio-fullname">${currentUser.fullname}</div>
                            <div class="bio-text">${currentUser.bio}</div>
                            ${currentUser.website ? `<a href="https://${currentUser.website}" target="_blank" class="bio-link">🔗 ${currentUser.website}</a>` : ''}
                        </div>
                    </div>
                </div>

                <div class="profile-tabs">
                    <div class="tab active" data-tab="posts">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        <span>PUBLICATIONS</span>
                    </div>
                    <div class="tab" data-tab="reels">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.5 5.5h19v13h-19z"/>
                            <path d="M9.5 8.5l6 3.5-6 3.5z"/>
                        </svg>
                        <span>REELS</span>
                    </div>
                    <div class="tab" data-tab="tagged">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.417 8.11.75.75 0 1 1-1.5.086 7.5 7.5 0 0 0-14.026 0 .75.75 0 1 1-1.5-.086 9.005 9.005 0 0 1 5.417-8.11A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/>
                        </svg>
                        <span>IDENTIFIES</span>
                    </div>
                </div>

                <div class="posts-grid" id="postsGrid"></div>
                <div id="reelsGrid" style="display: none;" class="posts-grid"></div>
                <div id="taggedGrid" style="display: none;" class="posts-grid"></div>
            `;

            renderPostsGrid();
            setupTabs();
        }

        // ========== RENDU GRILLE POSTS ==========
        function renderPostsGrid() {
            const grid = document.getElementById('postsGrid');
            if (!grid) return;
            
            grid.innerHTML = userPosts.map(post => `
                <div class="post-item" onclick="viewPost(${post.id})">
                    <img src="${post.imageUrl}" alt="Post">
                    <div class="post-overlay">
                        <div class="overlay-item">
                            <svg viewBox="0 0 24 24" fill="white">
                                <path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938Z"/>
                            </svg>
                            ${post.likes}
                        </div>
                        <div class="overlay-item">
                            <svg viewBox="0 0 24 24" fill="white">
                                <path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/>
                            </svg>
                            ${post.comments}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ========== TABS ==========
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            const postsGrid = document.getElementById('postsGrid');
            const reelsGrid = document.getElementById('reelsGrid');
            const taggedGrid = document.getElementById('taggedGrid');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const tabName = tab.dataset.tab;
                    
                    postsGrid.style.display = 'none';
                    reelsGrid.style.display = 'none';
                    taggedGrid.style.display = 'none';

                    if (tabName === 'posts') {
                        postsGrid.style.display = 'grid';
                        renderPostsGrid();
                    } else if (tabName === 'reels') {
                        reelsGrid.style.display = 'grid';
                        reelsGrid.innerHTML = '<div class="loader" style="grid-column: span 3;">🎬 Reels - Bientôt disponible</div>';
                    } else if (tabName === 'tagged') {
                        taggedGrid.style.display = 'grid';
                        taggedGrid.innerHTML = '<div class="loader" style="grid-column: span 3;">🏷️ Photos où vous êtes identifié - Bientôt</div>';
                    }
                });
            });
        }

        // ========== MODAL ÉDITION PROFIL ==========
        function openEditModal() {
            const modal = document.getElementById('editProfileModal');
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editFullname').value = currentUser.fullname;
            document.getElementById('editBio').value = currentUser.bio;
            document.getElementById('editWebsite').value = currentUser.website || '';
            modal.classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editProfileModal').classList.remove('active');
        }

        function saveProfile() {
            currentUser.username = document.getElementById('editUsername').value;
            currentUser.fullname = document.getElementById('editFullname').value;
            currentUser.bio = document.getElementById('editBio').value;
            currentUser.website = document.getElementById('editWebsite').value;
            
            closeEditModal();
            loadProfile(); // Recharger le profil avec les nouvelles infos
            
            // Mettre à jour le header
            document.getElementById('headerUsername').textContent = currentUser.username;
        }

        // ========== AUTRES FONCTIONS ==========
        function changeAvatar() {
            const newAvatar = prompt("Entrez la lettre/emoji pour votre avatar :", currentUser.avatar);
            if (newAvatar && newAvatar.length === 1) {
                currentUser.avatar = newAvatar;
                loadProfile();
            }
        }

        function viewPost(postId) {
            alert(`📸 Voir le post #${postId} (fonctionnalité bientôt disponible)`);
        }

        function openSettings() {
            alert("⚙️ Paramètres - Bientôt disponible");
        }

        // Fermer modal en cliquant en dehors
        document.getElementById('editProfileModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('editProfileModal')) {
                closeEditModal();
            }
        });

        // ========== INITIALISATION ==========
        loadProfile();
    </script>
</body>
</html>
