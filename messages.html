<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Messages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="messages-header" style="position:sticky;top:0;background:#000;border-bottom:1px solid #262626;padding:12px 16px;display:flex;align-items:center;gap:20px;z-index:100;">
        <button class="back-btn" onclick="window.location.href='index.html'" style="background:none;border:none;cursor:pointer;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2"/>
            </svg>
        </button>
        <h3 style="font-size:20px;font-weight:600;flex:1;">Messages</h3>
        <button class="new-msg-btn" onclick="chatModule.openNewMessageModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">✏️</button>
    </div>

    <div class="chat-module-container" style="display:flex;height:calc(100vh - 60px);">
        <div class="chat-conversations-list" id="conversationsList"></div>
        <div class="chat-area" id="chatAreaContainer"></div>
    </div>

    <script src="modules/chat.js"></script>
    <script>
        // Initialiser le chat
        function initChatPage() {
            chatModule.renderConversationsList('conversationsList');
            chatModule.renderChatArea('chatAreaContainer');
            
            // S'abonner aux événements
            chatModule.subscribe((event, data) => {
                if (event === 'conversationSelected') {
                    chatModule.renderChatArea('chatAreaContainer');
                    chatModule.renderConversationsList('conversationsList');
                } else if (event === 'newMessage') {
                    chatModule.renderConversationsList('conversationsList');
                    if (chatModule.currentConversation?.userId === data.userId) {
                        chatModule.renderChatArea('chatAreaContainer');
                    }
                } else if (event === 'unreadUpdate') {
                    // Mettre à jour le badge dans la sidebar (si besoin)
                    const msgBadge = document.querySelector('.nav-item[data-page="messages"] .msg-badge');
                    if (data.count > 0) {
                        if (!msgBadge) {
                            const msgIcon = document.querySelector('.nav-item[data-page="messages"]');
                            if (msgIcon) {
                                const badge = document.createElement('span');
                                badge.className = 'msg-badge';
                                badge.textContent = data.count > 99 ? '99+' : data.count;
                                msgIcon.appendChild(badge);
                            }
                        } else {
                            msgBadge.textContent = data.count > 99 ? '99+' : data.count;
                            msgBadge.style.display = 'flex';
                        }
                    } else if (msgBadge) {
                        msgBadge.style.display = 'none';
                    }
                }
            });
        }
        
        initChatPage();
    </script>
</body>
</html>
