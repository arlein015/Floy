<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Messages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }
        
        .messages-header {
            position: sticky;
            top: 0;
            background: #000000;
            border-bottom: 1px solid #262626;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
        }
        .messages-header h3 {
            font-size: 20px;
            font-weight: 600;
            flex: 1;
        }
        .new-msg-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
        
        .conversations-list {
            padding: 8px 0;
        }
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #1a1a1a;
        }
        .conversation-item:hover {
            background: #1a1a1a;
        }
        .conv-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        .conv-info {
            flex: 1;
        }
        .conv-username {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .conv-last-message {
            font-size: 13px;
            color: #8e8e8e;
        }
        .conv-time {
            font-size: 11px;
            color: #8e8e8e;
        }
        .empty-conversations {
            text-align: center;
            padding: 60px 20px;
            color: #8e8e8e;
        }
        .empty-conversations svg {
            width: 60px;
            height: 60px;
            margin-bottom: 16px;
            stroke: #8e8e8e;
        }
        .empty-conversations button {
            background: #FF6B35;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            color: white;
            margin-top: 16px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #000;
            border-radius: 16px;
            width: 350px;
            max-width: 90%;
            border: 1px solid #262626;
        }
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-body {
            padding: 16px;
        }
        .modal-body input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            color: white;
            margin-bottom: 16px;
        }
        .search-results {
            max-height: 300px;
            overflow-y: auto;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
        }
        .search-result-item:hover {
            background: #1a1a1a;
        }
        .result-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="messages-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <h3>Messages</h3>
        <button class="new-msg-btn" onclick="openNewMessageModal()">✏️</button>
    </div>

    <div class="conversations-list" id="conversationsList">
        <div class="empty-conversations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/>
            </svg>
            <p>Vos messages apparaîtront ici</p>
            <button onclick="openNewMessageModal()">Envoyer un message</button>
        </div>
    </div>

    <div id="newMessageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nouveau message</h3>
                <button class="modal-close" onclick="closeNewMessageModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="searchUser" placeholder="Rechercher un utilisateur..." onkeyup="searchUsers(this.value)">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </div>

    <script>
        let conversations = [];
        let currentUser = { id: 1, username: "floy_user", avatar: "F" };

        function loadConversations() {
            const saved = localStorage.getItem('floy_conversations');
            if (saved) {
                conversations = JSON.parse(saved);
            } else {
                conversations = [
                    { userId: 2, username: "artiste_orange", avatar: "A", lastMessage: "Super ton post ! 🔥", lastTime: Date.now() - 3600000, unreadCount: 2 },
                    { userId: 3, username: "photographe", avatar: "P", lastMessage: "J'adore !", lastTime: Date.now() - 86400000, unreadCount: 0 }
                ];
                localStorage.setItem('floy_conversations', JSON.stringify(conversations));
            }
            renderConversations();
        }

        function renderConversations() {
            const container = document.getElementById('conversationsList');
            
            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-conversations">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/>
                        </svg>
                        <p>Vos messages apparaîtront ici</p>
                        <button onclick="openNewMessageModal()">Envoyer un message</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item" onclick="openChat(${conv.userId})">
                    <div class="conv-avatar">${conv.avatar}</div>
                    <div class="conv-info">
                        <div class="conv-username">${conv.username}</div>
                        <div class="conv-last-message">${conv.lastMessage || ''}</div>
                    </div>
                    <div class="conv-time">${getTimeAgo(conv.lastTime)}</div>
                    ${conv.unreadCount > 0 ? `<div style="background:#FF6B35;padding:2px 8px;border-radius:20px;font-size:11px;">${conv.unreadCount}</div>` : ''}
                </div>
            `).join('');
        }

        function openChat(userId) {
            alert(`💬 Conversation avec l'utilisateur #${userId} - (Fonctionnalité bientôt disponible)`);
        }

        function openNewMessageModal() {
            document.getElementById('newMessageModal').classList.add('active');
            searchUsers('');
        }

        function closeNewMessageModal() {
            document.getElementById('newMessageModal').classList.remove('active');
        }

        function searchUsers(query) {
            const suggestedUsers = [
                { id: 2, username: "artiste_orange", avatar: "A" },
                { id: 3, username: "photographe", avatar: "P" },
                { id: 4, username: "design_noir", avatar: "D" },
                { id: 5, username: "voyageur", avatar: "V" }
            ];
            
            const filtered = suggestedUsers.filter(u => 
                u.username.toLowerCase().includes(query.toLowerCase()) && u.id !== currentUser.id
            );
            
            const resultsDiv = document.getElementById('searchResults');
            if (filtered.length === 0 && query.length > 0) {
                resultsDiv.innerHTML = '<div style="text-align:center;padding:20px;color:#8e8e8e;">Aucun utilisateur trouvé</div>';
            } else {
                resultsDiv.innerHTML = filtered.map(user => `
                    <div class="search-result-item" onclick="startConversation(${user.id}, '${user.username}', '${user.avatar}')">
                        <div class="result-avatar">${user.avatar}</div>
                        <div class="result-name">${user.username}</div>
                    </div>
                `).join('');
            }
        }

        function startConversation(userId, username, avatar) {
            alert(`💬 Nouvelle conversation avec ${username} - (Fonctionnalité bientôt disponible)`);
            closeNewMessageModal();
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return '';
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "à l'instant";
            if (diff < 3600) return `${Math.floor(diff/60)} min`;
            if (diff < 86400) return `${Math.floor(diff/3600)} h`;
            return `${Math.floor(diff/86400)} j`;
        }

        document.getElementById('newMessageModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('newMessageModal')) closeNewMessageModal();
        });

        loadConversations();
    </script>
</body>
</html>
