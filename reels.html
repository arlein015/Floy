<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Reels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }
        
        .reels-header {
            position: sticky;
            top: 0;
            background: #000000;
            border-bottom: 1px solid #262626;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
        }
        .reels-header h3 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .reels-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .reel-item {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
        }
        .reel-video {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #1a1a1a;
        }
        .reel-info {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reel-username {
            font-weight: 600;
        }
        
        .loader {
            text-align: center;
            padding: 60px;
            color: #8e8e8e;
        }
    </style>
</head>
<body>
    <div class="reels-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <h3>Reels</h3>
    </div>

    <div class="reels-container" id="reelsContainer">
        <div class="loader">🎬 Chargement des reels...</div>
    </div>

    <script>
        function loadReels() {
            const posts = JSON.parse(localStorage.getItem('floy_posts') || '[]');
            const videos = posts.filter(p => p.type === 'video');
            const container = document.getElementById('reelsContainer');
            
            if (videos.length === 0) {
                container.innerHTML = '<div class="loader">🎬 Aucune vidéo pour le moment</div>';
                return;
            }
            
            container.innerHTML = videos.map(video => `
                <div class="reel-item">
                    <video class="reel-video" src="${video.mediaUrl}" controls loop></video>
                    <div class="reel-info">
                        <div class="reel-avatar">${video.avatar || video.username.charAt(0)}</div>
                        <div class="reel-username">${video.username}</div>
                    </div>
                </div>
            `).join('');
        }
        
        loadReels();
    </script>
</body>
</html>
