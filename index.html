<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floy - Partagez vos moments</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #FFFFFF;
        }

        /* ===== THEME ORANGE & NOIR ===== */
        :root {
            --floy-orange: #FF6B35;
            --floy-orange-dark: #E55A2B;
            --floy-black: #000000;
            --floy-gray: #262626;
            --floy-gray-light: #8e8e8e;
        }

        /* ===== SIDEBAR GAUCHE ===== */
        .sidebar {
            width: 244px;
            background: #000000;
            border-right: 1px solid #262626;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            padding: 20px 12px 20px 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 25px 12px 16px 12px;
            margin-bottom: 20px;
        }

        .logo .floy-text {
            background: linear-gradient(135deg, #FF6B35, #FF9F5C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #f5f5f5;
            font-size: 16px;
        }

        .nav-item:hover {
            background: #1a1a1a;
        }

        .nav-item.active {
            font-weight: 600;
            color: #FF6B35;
        }

        .nav-item i, .nav-item svg {
            width: 24px;
            height: 24px;
            font-size: 24px;
        }

        /* ===== CONTENU PRINCIPAL ===== */
        .main-content {
            margin-left: 244px;
            max-width: 630px;
            margin-right: auto;
            padding: 20px 20px 0 20px;
        }

        /* ===== HEADER (style Instagram) ===== */
        .header {
            position: sticky;
            top: 0;
            background: #000000;
            z-index: 10;
            padding: 8px 0;
            border-bottom: 1px solid #262626;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            padding: 8px 0;
        }

        /* ===== POST CARD (exactement comme Instagram) ===== */
        .post {
            margin-bottom: 20px;
            background: #000000;
            border: 1px solid #262626;
            border-radius: 8px;
        }

        /* En-tête du post */
        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .post-username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-more {
            cursor: pointer;
        }

        /* Image du post */
        .post-image {
            width: 100%;
            background: #1a1a1a;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        /* ===== ACTIONS DU POST (BOUTONS STYLE INSTAGRAM) ===== */
        .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
        }

        .action-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .action-icon:hover {
            transform: scale(1.05);
        }

        .action-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 2;
        }

        /* Like actif (rempli) */
        .action-icon.liked svg {
            fill: #FF6B35;
            stroke: #FF6B35;
        }

        /* Bouton Save (à droite) */
        .post-actions-right {
            margin-left: auto;
        }

        /* Compteur de likes */
        .post-likes {
            font-weight: 600;
            font-size: 14px;
            padding: 0 16px 8px;
        }

        /* Légende */
        .post-caption {
            padding: 0 16px 8px;
            font-size: 14px;
        }

        .post-caption strong {
            font-weight: 600;
            margin-right: 6px;
        }

        /* Commentaires */
        .post-comments {
            padding: 0 16px 4px;
            font-size: 14px;
            color: #8e8e8e;
        }

        /* Timestamp */
        .post-time {
            padding: 4px 16px 12px;
            font-size: 10px;
            color: #8e8e8e;
            letter-spacing: 0.2px;
        }

        /* Formulaire commentaire */
        .comment-form {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid #262626;
        }

        .comment-input {
            flex: 1;
            background: none;
            border: none;
            color: #f5f5f5;
            padding: 12px 0;
            font-size: 14px;
            outline: none;
        }

        .comment-input::placeholder {
            color: #8e8e8e;
        }

        .comment-post-btn {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
        }

        .comment-post-btn.active {
            opacity: 1;
        }

        /* ===== SECTIONS ===== */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* ===== PLACEHOLDER ===== */
        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #8e8e8e;
        }

        /* ===== FLOATING UPLOAD ===== */
        .floating-upload {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: #FF6B35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,107,53,0.4);
            transition: 0.2s;
        }

        .floating-upload:hover {
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .sidebar {
                width: 72px;
            }
            .sidebar .logo,
            .sidebar .nav-item span {
                display: none;
            }
            .main-content {
                margin-left: 72px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <span class="floy-text">✨ FLOY</span>
        </div>
        <div class="nav-item active" data-section="feed">
            <svg aria-label="Accueil" fill="currentColor" viewBox="0 0 24 24">
                <path d="M22 23h-6.001a1 1 0 0 1-1-1v-5.455a2.997 2.997 0 1 0-5.993 0V22a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11.543a1.002 1.002 0 0 1 .31-.724l8.122-7.351a2.999 2.999 0 0 1 4.09-.043L22.7 10.82a1 1 0 0 1 .3.724V22a1 1 0 0 1-1 1Z"/>
            </svg>
            <span>Accueil</span>
        </div>
        <div class="nav-item" data-section="explore">
            <svg aria-label="Explorer" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm-8.5 6.5a8.5 8.5 0 1 1 17 0 8.5 8.5 0 0 1-17 0Z"/>
                <path d="M19.53 19.53l-4.16-4.16a.75.75 0 0 1 1.06-1.06l4.16 4.16a.75.75 0 0 1-1.06 1.06Z"/>
            </svg>
            <span>Explorer</span>
        </div>
        <div class="nav-item" data-section="profile">
            <svg aria-label="Profil" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.417 8.11.75.75 0 1 1-1.5.086 7.5 7.5 0 0 0-14.026 0 .75.75 0 1 1-1.5-.086 9.005 9.005 0 0 1 5.417-8.11A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/>
            </svg>
            <span>Profil</span>
        </div>
        <div class="nav-item" data-section="notifications">
            <svg aria-label="Notifications" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16.5 18.5v-5.5a4.5 4.5 0 0 0-9 0v5.5H5v-5.5a6 6 0 1 1 12 0v5.5h-2.5Z"/>
                <path d="M8.5 18.5h-2v-5.5a4.5 4.5 0 0 1 9 0v5.5h-2"/>
                <path d="M9 20.5h6"/>
            </svg>
            <span>Notifications</span>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="header-title">Floy</div>
        </div>

        <!-- SECTION FEED -->
        <div id="feed-section" class="section active">
            <div id="feed-container"></div>
        </div>

        <!-- AUTRES SECTIONS -->
        <div id="explore-section" class="section">
            <div class="placeholder">🔍 Explorez les tendances (bientôt)</div>
        </div>
        <div id="profile-section" class="section">
            <div class="placeholder">👤 Votre profil (bientôt)</div>
        </div>
        <div id="notifications-section" class="section">
            <div class="placeholder">❤️ Vos notifications (bientôt)</div>
        </div>
    </div>

    <div class="floating-upload" id="uploadBtn">
        <svg aria-label="Nouvelle publication" fill="currentColor" width="24" height="24" viewBox="0 0 24 24">
            <path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/>
        </svg>
    </div>

    <script>
        // ===== DONNÉES TEST =====
        let posts = [
            {
                id: 1,
                username: "floy_official",
                avatar: "F",
                imageUrl: "📷 Photo de test",
                caption: "Bienvenue sur Floy 🔥 Le réseau social orange et noir",
                likes: 124,
                liked: false,
                comments: ["Superbe plateforme !", "J'adore le thème"],
                timestamp: "2 HEURES"
            },
            {
                id: 2,
                username: "artiste_orange",
                avatar: "A",
                imageUrl: "🎨 Création du jour",
                caption: "L'orange et le noir, un duo parfait",
                likes: 89,
                liked: true,
                comments: ["Magnifique !", "Très inspirant"],
                timestamp: "5 HEURES"
            },
            {
                id: 3,
                username: "photographe",
                avatar: "P",
                imageUrl: "🌅 Coucher de soleil",
                caption: "Les couleurs chaudes",
                likes: 234,
                liked: false,
                comments: ["Waouh incroyable", "Super composition"],
                timestamp: "1 JOUR"
            }
        ];

        // ===== SVG ICONS (style Instagram) =====
        const icons = {
            like: `<svg aria-label="J'aime" fill="currentColor" viewBox="0 0 24 24"><path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938Z"/></svg>`,
            comment: `<svg aria-label="Commenter" fill="currentColor" viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>`,
            share: `<svg aria-label="Partager" fill="currentColor" viewBox="0 0 24 24"><path d="M19.5 5.5v13a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1Z"/><path d="m16.5 7.5-5 5"/><path d="M9.5 11.5h5v5"/></svg>`,
            save: `<svg aria-label="Enregistrer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16z"/></svg>`
        };

        // ===== RENDU D'UN POST =====
        function renderPost(post) {
            return `
                <div class="post" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-user-info">
                            <div class="post-avatar">${post.avatar}</div>
                            <div class="post-username">${post.username}</div>
                        </div>
                        <div class="post-more">•••</div>
                    </div>
                    
                    <div class="post-image">${post.imageUrl}</div>
                    
                    <div class="post-actions">
                        <button class="action-icon like-btn ${post.liked ? 'liked' : ''}" data-id="${post.id}">
                            ${icons.like}
                        </button>
                        <button class="action-icon comment-btn" data-id="${post.id}">
                            ${icons.comment}
                        </button>
                        <button class="action-icon share-btn">
                            ${icons.share}
                        </button>
                        <div class="post-actions-right">
                            <button class="action-icon save-btn">
                                ${icons.save}
                            </button>
                        </div>
                    </div>
                    
                    <div class="post-likes" id="likes-${post.id}">
                        ${post.likes} ${post.likes === 1 ? 'like' : 'likes'}
                    </div>
                    
                    <div class="post-caption">
                        <strong>${post.username}</strong> ${post.caption}
                    </div>
                    
                    <div class="post-comments">
                        ${post.comments.length > 0 ? `Voir les ${post.comments.length} commentaires` : 'Soyez le premier à commenter'}
                    </div>
                    
                    <div class="post-time">
                        il y a ${post.timestamp}
                    </div>
                    
                    <div class="comment-form">
                        <input type="text" class="comment-input" placeholder="Ajouter un commentaire..." data-id="${post.id}">
                        <button class="comment-post-btn" data-id="${post.id}">Publier</button>
                    </div>
                </div>
            `;
        }

        // ===== AFFICHER LE FEED =====
        function renderFeed() {
            const container = document.getElementById('feed-container');
            if (!container) return;
            container.innerHTML = posts.map(p => renderPost(p)).join('');
            attachEvents();
        }

        // ===== GESTION LIKE =====
        function handleLike(postId, btn) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            if (post.liked) {
                post.likes--;
                post.liked = false;
                btn.classList.remove('liked');
            } else {
                post.likes++;
                post.liked = true;
                btn.classList.add('liked');
                
                // Animation (effet coeur qui apparaît)
                btn.style.transform = 'scale(1.2)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
            
            // Mettre à jour l'affichage
            const likesSpan = document.getElementById(`likes-${postId}`);
            if (likesSpan) {
                likesSpan.textContent = `${post.likes} ${post.likes === 1 ? 'like' : 'likes'}`;
            }
        }

        // ===== GESTION COMMENTAIRE =====
        function addComment(postId, input, btn) {
            const text = input.value.trim();
            if (!text) return;
            
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.comments.push(text);
                const commentsDiv = input.closest('.post').querySelector('.post-comments');
                if (commentsDiv) {
                    commentsDiv.textContent = `Voir les ${post.comments.length} commentaires`;
                }
                input.value = '';
            }
        }

        // ===== ATTACHER LES ÉVÉNEMENTS =====
        function attachEvents() {
            // Likes
            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.removeEventListener('click', (e) => {});
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const postId = parseInt(btn.dataset.id);
                    handleLike(postId, btn);
                });
            });
            
            // Commentaires (bouton Publier)
            document.querySelectorAll('.comment-post-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const postId = parseInt(btn.dataset.id);
                    const input = document.querySelector(`.comment-input[data-id="${postId}"]`);
                    if (input) addComment(postId, input, btn);
                });
            });
            
            // Input commentaire (touche Entrée)
            document.querySelectorAll('.comment-input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const postId = parseInt(input.dataset.id);
                        const btn = document.querySelector(`.comment-post-btn[data-id="${postId}"]`);
                        if (btn) addComment(postId, input, btn);
                    }
                });
            });
        }

        // ===== NAVIGATION =====
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const sections = ['feed', 'explore', 'profile', 'notifications'];
            
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const sectionName = item.dataset.section;
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    sections.forEach(sec => {
                        const el = document.getElementById(`${sec}-section`);
                        if (el) el.classList.remove('active');
                    });
                    const activeSection = document.getElementById(`${sectionName}-section`);
                    if (activeSection) activeSection.classList.add('active');
                });
            });
        }

        // ===== UPLOAD =====
        function setupUpload() {
            document.getElementById('uploadBtn').addEventListener('click', () => {
                alert('📸 Module upload - bientôt disponible');
            });
        }

        // ===== INIT =====
        function init() {
            renderFeed();
            setupNavigation();
            setupUpload();
        }
        
        init();
    </script>
</body>
</html>
