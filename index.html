<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Partagez vos moments</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Styles spécifiques aux modules (chargés automatiquement par chaque module) -->
</head>
<body>
    <div class="layout">
        
        <!-- ========== SIDEBAR GAUCHE ========== -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="1.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">Floy</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item active" data-page="feed">
                    <svg viewBox="0 0 24 24"><path d="M22 23h-6.001a1 1 0 0 1-1-1v-5.455a2.997 2.997 0 1 0-5.993 0V22a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11.543a1.002 1.002 0 0 1 .31-.724l8.122-7.351a2.999 2.999 0 0 1 4.09-.043L22.7 10.82a1 1 0 0 1 .3.724V22a1 1 0 0 1-1 1Z"/></svg>
                    <span>Accueil</span>
                </div>
                <div class="nav-item" data-page="explore">
                    <svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm-8.5 6.5a8.5 8.5 0 1 1 17 0 8.5 8.5 0 0 1-17 0Z"/><path d="M19.53 19.53l-4.16-4.16a.75.75 0 0 1 1.06-1.06l4.16 4.16a.75.75 0 0 1-1.06 1.06Z"/></svg>
                    <span>Explorer</span>
                </div>
                <div class="nav-item" data-page="reels">
                    <svg viewBox="0 0 24 24"><path d="M2.5 5.5h19v13h-19z"/><path d="M9.5 8.5l6 3.5-6 3.5z"/></svg>
                    <span>Reels</span>
                </div>
                <div class="nav-item" data-page="create">
                    <svg viewBox="0 0 24 24"><path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/></svg>
                    <span>Créer</span>
                </div>
                <div class="nav-item" data-page="notifications">
                    <svg viewBox="0 0 24 24"><path d="M16.5 18.5v-5.5a4.5 4.5 0 0 0-9 0v5.5H5v-5.5a6 6 0 1 1 12 0v5.5h-2.5Z"/><path d="M8.5 18.5h-2v-5.5a4.5 4.5 0 0 1 9 0v5.5h-2"/><path d="M9 20.5h6"/></svg>
                    <span>Notifications</span>
                </div>
                <div class="nav-item" data-page="messages">
                    <svg viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>
                    <span>Messages</span>
                </div>
                <div class="nav-item" data-page="profile">
                    <svg viewBox="0 0 24 24"><path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.417 8.11.75.75 0 1 1-1.5.086 7.5 7.5 0 0 0-14.026 0 .75.75 0 1 1-1.5-.086 9.005 9.005 0 0 1 5.417-8.11A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/></svg>
                    <span>Profil</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="nav-item" data-page="settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M18.37 7.29l1.06-1.06a1.5 1.5 0 0 0-2.12-2.12L15.7 6.12a7.5 7.5 0 0 0-7.4 0L6.69 4.11a1.5 1.5 0 1 0-2.12 2.12l1.06 1.06a7.5 7.5 0 0 0 0 7.4l-1.06 1.06a1.5 1.5 0 0 0 2.12 2.12l1.06-1.06a7.5 7.5 0 0 0 7.4 0l1.06 1.06a1.5 1.5 0 0 0 2.12-2.12l-1.06-1.06a7.5 7.5 0 0 0 0-7.4z"/></svg>
                    <span>Paramètres</span>
                </div>
            </div>
        </aside>

        <!-- ========== CONTENU PRINCIPAL ========== -->
        <main class="main-content">
            <!-- Stories container -->
            <div class="stories-container" id="stories"></div>
            
            <!-- Feed container -->
            <div id="feed-container"></div>
        </main>

        <!-- ========== SIDEBAR DROITE ========== -->
        <aside class="right-sidebar">
            <div class="current-user" id="currentUserSidebar">
                <div class="user-avatar" id="sidebarAvatar">F</div>
                <div class="user-info">
                    <div class="username" id="sidebarUsername">floy_user</div>
                    <div class="name" id="sidebarName">Floy Creator</div>
                </div>
            </div>
            <div class="suggestions-header">
                <span>Suggestions</span>
                <button class="see-all">Voir tout</button>
            </div>
            <div class="suggestions-list" id="suggestionsList"></div>
        </aside>
    </div>

    <!-- ========== CHARGEMENT DES MODULES ========== -->
    <!-- Ordre important : les modules sont chargés séquentiellement -->
    <script src="modules/like.js"></script>
    <script src="modules/commentaire.js"></script>
    <script src="modules/partage.js"></script>
    <script src="modules/upload.js"></script>
    <script src="modules/stories.js"></script>
    <script src="modules/carrousel.js"></script>
    <script src="modules/notifications.js"></script>
    <script src="modules/messages.js"></script>
    
    <!-- ========== SCRIPT PRINCIPAL ========== -->
    <script>
        // ========== DONNÉES GLOBALES ==========
        let currentUser = {
            id: 1,
            username: "floy_user",
            fullname: "Floy Creator",
            avatar: "F",
            avatarUrl: null
        };
        
        let posts = [];

        // ========== CHARGEMENT DES DONNÉES ==========
        function loadData() {
            const savedUser = localStorage.getItem('floy_user');
            if (savedUser) {
                currentUser = { ...currentUser, ...JSON.parse(savedUser) };
            }
            
            const savedPosts = localStorage.getItem('floy_posts');
            if (savedPosts) {
                posts = JSON.parse(savedPosts);
            } else {
                posts = [
                    { id: 1, userId: 1, username: "floy_user", avatar: "F", type: "photo", mediaUrl: "https://picsum.photos/600/500?random=1", caption: "Bienvenue sur Floy ! 🔥", likes: 124, liked: false, comments: [], timestamp: Date.now() - 3600000 },
                    { id: 2, userId: 2, username: "artiste_orange", avatar: "A", type: "photo", mediaUrl: "https://picsum.photos/600/500?random=2", caption: "L'orange et le noir, un duo parfait !", likes: 89, liked: false, comments: [], timestamp: Date.now() - 7200000 }
                ];
                localStorage.setItem('floy_posts', JSON.stringify(posts));
            }
            
            updateSidebar();
        }

        function updateSidebar() {
            const avatarEl = document.getElementById('sidebarAvatar');
            avatarEl.innerHTML = currentUser.avatarUrl ? `<img src="${currentUser.avatarUrl}">` : currentUser.avatar;
            document.getElementById('sidebarUsername').innerHTML = currentUser.username;
            document.getElementById('sidebarName').innerHTML = currentUser.fullname;
        }

        // ========== RENDU DU FEED ==========
        function renderFeed() {
            const container = document.getElementById('feed-container');
            if (!container) return;
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="loader">📸 Aucune publication</div>';
                return;
            }
            
            const sorted = [...posts].sort((a,b) => b.timestamp - a.timestamp);
            
            container.innerHTML = sorted.map(post => `
                <article class="post" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-user" onclick="goToUserProfile(${post.userId})">
                            <div class="post-avatar">${post.avatar}</div>
                            <div class="post-username">${post.username}</div>
                        </div>
                        <button class="post-more" onclick="showPostOptions(${post.id})">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><circle cx="5" cy="12" r="2.5"/></svg>
                        </button>
                    </div>
                    
                    <div class="post-image-container" onclick="viewMedia('${post.mediaUrl}')">
                        ${post.type === 'video' ? `<video class="post-video" src="${post.mediaUrl}" controls></video>` : `<img class="post-image" src="${post.mediaUrl}">`}
                    </div>
                    
                    <div class="post-actions">
                        ${typeof likeModule !== 'undefined' ? likeModule.renderLikeButton(post.id, post.liked) : '<button>❤️</button>'}
                        <button class="action-btn" onclick="commentaireModule.showAllCommentaires(${post.id})">
                            <svg viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>
                        </button>
                        <button class="action-btn" onclick="partageModule.showShareModal(${post.id}, '${post.mediaUrl}', '${post.caption}')">
                            <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
                        </button>
                        <button class="action-btn save-btn" onclick="savePost(${post.id})">
                            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16z"/></svg>
                        </button>
                    </div>
                    
                    <div class="post-likes" id="likes-${post.id}">${formatLikes(post.likes)}</div>
                    <div class="post-caption"><strong>${post.username}</strong> ${post.caption}</div>
                    <div class="post-comments" onclick="commentaireModule.showAllCommentaires(${post.id})">Voir les ${post.comments?.length || 0} commentaires</div>
                    <div class="post-time">il y a ${getTimeAgo(post.timestamp)}</div>
                    
                    <div class="comment-form">
                        <input type="text" class="comment-input" id="comment-input-${post.id}" placeholder="Ajouter un commentaire..." onkeypress="if(event.key==='Enter') addQuickComment(${post.id})">
                        <button class="comment-post-btn" onclick="addQuickComment(${post.id})">Publier</button>
                    </div>
                </article>
            `).join('');
        }

        function addQuickComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (text && typeof commentaireModule !== 'undefined') {
                commentaireModule.addCommentaire(postId, text);
                input.value = '';
                renderFeed();
            }
        }

        function formatLikes(count) {
            if (count === 0) return "0 like";
            if (count === 1) return "1 like";
            if (count < 1000) return `${count} likes`;
            return `${(count/1000).toFixed(1)}k likes`;
        }

        function getTimeAgo(timestamp) {
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "à l'instant";
            if (diff < 3600) return `${Math.floor(diff/60)} min`;
            if (diff < 86400) return `${Math.floor(diff/3600)} h`;
            return `${Math.floor(diff/86400)} j`;
        }

        function viewMedia(url) { window.open(url, '_blank'); }
        function savePost(id) { alert(`🔖 Post ${id} sauvegardé`); }
        function showPostOptions(id) { if(confirm('Supprimer ?')) { posts = posts.filter(p=>p.id!==id); localStorage.setItem('floy_posts',JSON.stringify(posts)); renderFeed(); } }
        function goToUserProfile(id) { if(id===currentUser.id) window.location.href='profil.html'; else alert(`Profil utilisateur #${id}`); }

        // ========== RENDU DES STORIES ==========
        function renderStories() {
            if (typeof storiesModule !== 'undefined') {
                storiesModule.renderStories('stories');
            } else {
                document.getElementById('stories').innerHTML = '<div class="loader">📸 Stories</div>';
            }
        }

        // ========== SUGGESTIONS ==========
        function setupSuggestions() {
            document.getElementById('suggestionsList').innerHTML = `
                <div class="suggestion-item"><div class="suggestion-avatar">A</div><div class="suggestion-info"><div class="username">artiste_orange</div><div class="followers">12k abonnés</div></div><button class="follow-btn">Suivre</button></div>
                <div class="suggestion-item"><div class="suggestion-avatar">P</div><div class="suggestion-info"><div class="username">photographe</div><div class="followers">8.5k abonnés</div></div><button class="follow-btn">Suivre</button></div>
            `;
        }

        // ========== NAVIGATION ==========
        function setupNavigation() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    
                    if (page === 'create' && typeof uploadModule !== 'undefined') {
                        uploadModule.openUploadModal();
                        item.classList.remove('active');
                        document.querySelector('.nav-item[data-page="feed"]').classList.add('active');
                    } else if (page === 'notifications' && typeof notificationsModule !== 'undefined') {
                        notificationsModule.showNotificationsModal();
                    } else if (page === 'messages' && typeof messagesModule !== 'undefined') {
                        messagesModule.openMessagesModal();
                    } else if (page !== 'feed') {
                        alert(`📱 Page ${page} - Bientôt disponible`);
                    }
                });
            });
        }

        // ========== INITIALISATION ==========
        function init() {
            loadData();
            renderFeed();
            renderStories();
            setupSuggestions();
            setupNavigation();
        }
        
        init();
        window.renderFeed = renderFeed;
    </script>
</body>
</html>
