<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floy - Partagez vos moments</title>
    
    <style>
        /* ===== THEME ORANGE & NOIR ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0A0A0A;
            color: #FFFFFF;
        }

        /* Layout principal */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR GAUCHE (Navigation) ===== */
        .sidebar {
            width: 260px;
            background: #000000;
            border-right: 1px solid #ff6b3520;
            padding: 20px 12px;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #FF6B35;
            margin-bottom: 40px;
            padding: 0 12px;
        }

        .logo span {
            background: #FF6B35;
            color: #000;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 14px;
            margin-left: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            margin: 4px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
        }

        .nav-item:hover {
            background: #1a1a1a;
            color: #FF6B35;
        }

        .nav-item.active {
            background: #FF6B3510;
            color: #FF6B35;
            font-weight: 500;
        }

        .nav-item i {
            width: 24px;
            font-size: 22px;
        }

        /* ===== CONTENU PRINCIPAL ===== */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 20px 40px;
        }

        /* ===== HEADER ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #222;
            margin-bottom: 30px;
        }

        .search-bar {
            background: #1a1a1a;
            padding: 10px 18px;
            border-radius: 30px;
            width: 300px;
            border: 1px solid #333;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            outline: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* ===== GRILLE DES POSTS (FEED) ===== */
        .feed-grid {
            max-width: 600px;
            margin: 0 auto;
        }

        .post-card {
            background: #111111;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid #222;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-user {
            font-weight: 600;
        }

        .post-time {
            font-size: 12px;
            color: #888;
            margin-left: auto;
        }

        .post-image {
            width: 100%;
            background: #1a1a1a;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        .post-actions {
            display: flex;
            gap: 20px;
            padding: 12px 16px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            color: #FF6B35;
        }

        .post-likes {
            padding: 0 16px 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .post-caption {
            padding: 0 16px 12px;
            font-size: 14px;
        }

        /* ===== SIDEBAR DROITE (Suggestions) ===== */
        .right-sidebar {
            width: 320px;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            padding: 20px;
            display: none;
        }

        /* ===== BOUTON FLOATING POUR UPLOAD ===== */
        .floating-upload {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: #FF6B35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,107,53,0.3);
            transition: 0.3s;
        }

        .floating-upload:hover {
            transform: scale(1.1);
        }

        /* ===== SECTIONS ===== */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* ===== PLACEHOLDER STYLES ===== */
        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1000px) {
            .sidebar {
                width: 80px;
            }
            .sidebar .logo span,
            .sidebar .nav-item span:not(.icon-only) {
                display: none;
            }
            .main-content {
                margin-left: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        
        <!-- SIDEBAR GAUCHE (Navigation) -->
        <div class="sidebar">
            <div class="logo">
                FLOY<span>✨</span>
            </div>
            
            <div class="nav-item active" data-section="feed">
                <i>🏠</i>
                <span>Accueil</span>
            </div>
            <div class="nav-item" data-section="explore">
                <i>🔍</i>
                <span>Explorer</span>
            </div>
            <div class="nav-item" data-section="profile">
                <i>👤</i>
                <span>Profil</span>
            </div>
            <div class="nav-item" data-section="notifications">
                <i>❤️</i>
                <span>Notifications</span>
            </div>
        </div>

        <!-- CONTENU PRINCIPAL -->
        <div class="main-content">
            <div class="top-bar">
                <div class="search-bar">
                    <input type="text" placeholder="🔍 Rechercher sur Floy...">
                </div>
                <div class="user-info">
                    <div class="avatar">👤</div>
                    <span>Invito</span>
                </div>
            </div>

            <!-- SECTION FEED -->
            <div id="feed-section" class="section active">
                <div class="feed-grid" id="feed-container">
                    <!-- Les posts seront injectés ici -->
                </div>
            </div>

            <!-- SECTION EXPLORER -->
            <div id="explore-section" class="section">
                <div class="placeholder">
                    🔍 Page Explorer<br>
                    <small>Découvrez des contenus populaires (module à venir)</small>
                </div>
            </div>

            <!-- SECTION PROFIL -->
            <div id="profile-section" class="section">
                <div class="placeholder">
                    👤 Page Profil<br>
                    <small>Vos photos et informations (module à venir)</small>
                </div>
            </div>

            <!-- SECTION NOTIFICATIONS -->
            <div id="notifications-section" class="section">
                <div class="placeholder">
                    ❤️ Notifications<br>
                    <small>Vos activités récentes (module à venir)</small>
                </div>
            </div>
        </div>

        <!-- SIDEBAR DROITE (optionnelle) -->
        <div class="right-sidebar">
            <div class="placeholder">
                Suggestions<br>
                <small>Comptes à suivre (module à venir)</small>
            </div>
        </div>

        <!-- BOUTON FLOATING UPLOAD -->
        <div class="floating-upload" id="uploadBtn">
            📸
        </div>
    </div>

    <script>
        // ===== DONNÉES DE TEST (pour le squelette) =====
        const samplePosts = [
            {
                id: 1,
                username: "floy_official",
                avatar: "F",
                imagePlaceholder: "📷 Photo 1",
                caption: "Bienvenue sur Floy ! Le réseau social orange et noir 🔥",
                likes: 42,
                timeAgo: "2h"
            },
            {
                id: 2,
                username: "photographe_orange",
                avatar: "P",
                imagePlaceholder: "🌅 Coucher de soleil",
                caption: "Les couleurs chaudes rendent tout plus beau",
                likes: 128,
                timeAgo: "5h"
            },
            {
                id: 3,
                username: "artiste_noir",
                avatar: "A",
                imagePlaceholder: "🎨 Création du jour",
                caption: "L'orange et le noir, un duo parfait",
                likes: 89,
                timeAgo: "1j"
            }
        ];

        // ===== FONCTION POUR AFFICHER LE FEED =====
        function renderFeed() {
            const container = document.getElementById('feed-container');
            
            if (!container) return;
            
            container.innerHTML = samplePosts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar">${post.avatar}</div>
                        <div class="post-user">${post.username}</div>
                        <div class="post-time">${post.timeAgo}</div>
                    </div>
                    <div class="post-image">
                        ${post.imagePlaceholder}
                    </div>
                    <div class="post-actions">
                        <button class="action-btn" onclick="handleLike(this, ${post.id})">❤️</button>
                        <button class="action-btn">💬</button>
                        <button class="action-btn">📤</button>
                    </div>
                    <div class="post-likes">
                        ${post.likes} likes
                    </div>
                    <div class="post-caption">
                        <strong>${post.username}</strong> ${post.caption}
                    </div>
                </div>
            `).join('');
        }

        // ===== GESTION DES LIKES (temporaire) =====
        function handleLike(btn, postId) {
            // Animation simple pour le squelette
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 200);
            
            // Changement de couleur (simulation)
            if (btn.style.color === 'rgb(255, 107, 53)') {
                btn.style.color = '#e0e0e0';
            } else {
                btn.style.color = '#FF6B35';
            }
        }

        // ===== NAVIGATION ENTRE SECTIONS =====
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const sections = {
                feed: document.getElementById('feed-section'),
                explore: document.getElementById('explore-section'),
                profile: document.getElementById('profile-section'),
                notifications: document.getElementById('notifications-section')
            };
            
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const sectionName = item.dataset.section;
                    
                    // Mettre à jour la classe active
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    
                    // Cacher toutes les sections
                    Object.values(sections).forEach(section => {
                        if (section) section.classList.remove('active');
                    });
                    
                    // Afficher la section sélectionnée
                    if (sections[sectionName]) {
                        sections[sectionName].classList.add('active');
                    }
                });
            });
        }

        // ===== UPLOAD (alerte pour le moment) =====
        function setupUpload() {
            const uploadBtn = document.getElementById('uploadBtn');
            if (uploadBtn) {
                uploadBtn.addEventListener('click', () => {
                    alert('📸 Module upload photo - bientôt disponible !');
                });
            }
        }

        // ===== INITIALISATION =====
        function init() {
            renderFeed();
            setupNavigation();
            setupUpload();
            
            console.log('🔥 Floy - Squelette orange et noir prêt !');
        }

        // Lancer l'app
        init();
    </script>
</body>
</html>
