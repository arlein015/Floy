<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Partagez vos moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Sidebar */
        .sidebar {
            width: 244px;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            background: #000000;
            border-right: 1px solid #262626;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 25px 12px 16px;
            margin-bottom: 20px;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B35, #FF9F5C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #f5f5f5;
            position: relative;
        }

        .nav-item:hover {
            background: #1a1a1a;
        }

        .nav-item.active {
            font-weight: 600;
            color: #FF6B35;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #262626;
        }

        .notif-badge, .msg-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #FF6B35;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        .main-content {
            margin-left: 244px;
            flex: 1;
            max-width: 630px;
            padding: 0 20px;
        }

        /* Stories */
        .stories-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 16px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #262626;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-ring {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #1a1a1a;
        }

        .story-avatar.has-story {
            background: linear-gradient(45deg, #FF6B35, #FF9F5C, #FF6B35);
            padding: 2px;
        }

        .story-avatar-inner {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
        }

        .story-avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-plus-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 24px;
            height: 24px;
            background: #FF6B35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: 2px solid #000000;
        }

        .story-username {
            font-size: 12px;
            color: #8e8e8e;
            max-width: 70px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Post */
        .post {
            margin-bottom: 20px;
            background: #000000;
            border: 1px solid #262626;
            border-radius: 8px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            overflow: hidden;
        }

        .post-username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-more {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .post-more svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #f5f5f5;
        }

        .post-image-container {
            width: 100%;
            background: #1a1a1a;
            cursor: pointer;
        }

        .post-image {
            width: 100%;
            display: block;
        }

        .post-video {
            width: 100%;
            max-height: 500px;
        }

        .post-actions {
            display: flex;
            align-items: center;
            padding: 8px 12px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 1.5;
        }

        .action-btn.liked svg {
            fill: #FF6B35;
            stroke: #FF6B35;
        }

        .save-btn {
            margin-left: auto;
        }

        .post-likes {
            font-weight: 600;
            font-size: 14px;
            padding: 0 16px 8px;
            cursor: pointer;
        }

        .post-caption {
            padding: 0 16px 8px;
            font-size: 14px;
        }

        .post-caption strong {
            font-weight: 600;
            margin-right: 6px;
            cursor: pointer;
        }

        .post-comments {
            padding: 0 16px 4px;
            font-size: 14px;
            color: #8e8e8e;
            cursor: pointer;
        }

        .post-time {
            padding: 4px 16px 12px;
            font-size: 10px;
            color: #8e8e8e;
        }

        .comment-form {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid #262626;
        }

        .comment-input {
            flex: 1;
            background: none;
            border: none;
            color: #f5f5f5;
            padding: 12px 0;
            font-size: 14px;
            outline: none;
        }

        .comment-input::placeholder {
            color: #8e8e8e;
        }

        .comment-post-btn {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
        }

        .comment-post-btn:hover {
            opacity: 1;
        }

        /* Right sidebar */
        .right-sidebar {
            width: 320px;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            padding: 30px 20px;
            display: block;
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            overflow: hidden;
        }

        .user-info .username {
            font-weight: 600;
            font-size: 14px;
        }

        .user-info .name {
            font-size: 12px;
            color: #8e8e8e;
        }

        .suggestions-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: #8e8e8e;
            font-size: 14px;
        }

        .see-all {
            background: none;
            border: none;
            color: #f5f5f5;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .suggestion-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .suggestion-info .username {
            font-weight: 600;
            font-size: 14px;
        }

        .suggestion-info .followers {
            font-size: 12px;
            color: #8e8e8e;
        }

        .follow-btn {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
        }

        /* Modal Upload */
        .modal-upload {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-upload-content {
            background: #000;
            border-radius: 16px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #262626;
        }

        .modal-upload-header {
            padding: 16px 20px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
        }

        .modal-upload-header button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-upload-body {
            padding: 20px;
        }

        .upload-area {
            text-align: center;
            padding: 40px;
            border: 2px dashed #262626;
            border-radius: 12px;
            cursor: pointer;
        }

        .upload-area svg {
            color: #8e8e8e;
            margin-bottom: 16px;
        }

        .upload-area button {
            background: #FF6B35;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        #uploadPreview {
            text-align: center;
        }

        #previewImage, #previewVideo {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        #uploadCaption {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            color: white;
            margin-bottom: 16px;
            resize: none;
        }

        .publish-btn {
            width: 100%;
            background: #FF6B35;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        /* Modal Commentaires */
        .comments-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comments-modal-content {
            background: #000;
            border-radius: 16px;
            width: 400px;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            border: 1px solid #262626;
        }

        .comments-modal-header {
            padding: 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
        }

        .comments-modal-header button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .comment-content {
            flex: 1;
        }

        .comment-username {
            font-weight: 600;
            font-size: 13px;
        }

        .comment-text {
            font-size: 13px;
            margin-top: 4px;
        }

        .comments-footer {
            padding: 16px;
            border-top: 1px solid #262626;
            display: flex;
            gap: 12px;
        }

        .comments-footer input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            outline: none;
        }

        .comments-footer button {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            cursor: pointer;
        }

        .loader {
            text-align: center;
            padding: 60px;
            color: #8e8e8e;
        }

        @media (max-width: 1260px) {
            .right-sidebar { display: none; }
            .main-content { max-width: 100%; }
        }

        @media (max-width: 1000px) {
            .sidebar { width: 72px; }
            .sidebar .logo-text, .sidebar .nav-item span { display: none; }
            .main-content { margin-left: 72px; }
        }

        @media (max-width: 600px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 0 12px; }
        }

        @keyframes heartExplode {
            0% { transform: scale(0.5) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(-15deg); opacity: 1; }
            100% { transform: scale(2.5) rotate(15deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="1.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">Floy</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" data-page="feed">
                    <svg viewBox="0 0 24 24"><path d="M22 23h-6.001a1 1 0 0 1-1-1v-5.455a2.997 2.997 0 1 0-5.993 0V22a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11.543a1.002 1.002 0 0 1 .31-.724l8.122-7.351a2.999 2.999 0 0 1 4.09-.043L22.7 10.82a1 1 0 0 1 .3.724V22a1 1 0 0 1-1 1Z"/></svg>
                    <span>Accueil</span>
                </div>
                <div class="nav-item" data-page="explore">
                    <svg viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm-8.5 6.5a8.5 8.5 0 1 1 17 0 8.5 8.5 0 0 1-17 0Z"/><path d="M19.53 19.53l-4.16-4.16a.75.75 0 0 1 1.06-1.06l4.16 4.16a.75.75 0 0 1-1.06 1.06Z"/></svg>
                    <span>Explorer</span>
                </div>
                <div class="nav-item" data-page="reels">
                    <svg viewBox="0 0 24 24"><path d="M2.5 5.5h19v13h-19z"/><path d="M9.5 8.5l6 3.5-6 3.5z"/></svg>
                    <span>Reels</span>
                </div>
                <div class="nav-item" data-page="create">
                    <svg viewBox="0 0 24 24"><path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/></svg>
                    <span>Créer</span>
                </div>
                <div class="nav-item" data-page="notifications">
                    <svg viewBox="0 0 24 24"><path d="M16.5 18.5v-5.5a4.5 4.5 0 0 0-9 0v5.5H5v-5.5a6 6 0 1 1 12 0v5.5h-2.5Z"/><path d="M8.5 18.5h-2v-5.5a4.5 4.5 0 0 1 9 0v5.5h-2"/><path d="M9 20.5h6"/></svg>
                    <span>Notifications</span>
                </div>
                <div class="nav-item" data-page="messages">
                    <svg viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>
                    <span>Messages</span>
                </div>
                <div class="nav-item" data-page="profile">
                    <svg viewBox="0 0 24 24"><path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.417 8.11.75.75 0 1 1-1.5.086 7.5 7.5 0 0 0-14.026 0 .75.75 0 1 1-1.5-.086 9.005 9.005 0 0 1 5.417-8.11A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/></svg>
                    <span>Profil</span>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="nav-item" data-page="settings">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M18.37 7.29l1.06-1.06a1.5 1.5 0 0 0-2.12-2.12L15.7 6.12a7.5 7.5 0 0 0-7.4 0L6.69 4.11a1.5 1.5 0 1 0-2.12 2.12l1.06 1.06a7.5 7.5 0 0 0 0 7.4l-1.06 1.06a1.5 1.5 0 0 0 2.12 2.12l1.06-1.06a7.5 7.5 0 0 0 7.4 0l1.06 1.06a1.5 1.5 0 0 0 2.12-2.12l-1.06-1.06a7.5 7.5 0 0 0 0-7.4z"/></svg>
                    <span>Paramètres</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="stories-container" id="stories"></div>
            <div id="feed-container"></div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="right-sidebar">
            <div class="current-user" id="currentUserSidebar" onclick="goToProfile()">
                <div class="user-avatar" id="sidebarAvatar">F</div>
                <div class="user-info">
                    <div class="username" id="sidebarUsername">floy_user</div>
                    <div class="name" id="sidebarName">Floy Creator</div>
                </div>
            </div>
            <div class="suggestions-header">
                <span>Suggestions</span>
                <button class="see-all">Voir tout</button>
            </div>
            <div class="suggestions-list" id="suggestionsList"></div>
        </aside>
    </div>

    <script>
        // ==================== DONNÉES ====================
        let currentUser = {
            id: 1,
            username: "floy_user",
            fullname: "Floy Creator",
            avatar: "F",
            followers: 128,
            following: 94
        };
        
        let posts = [];
        let notifications = [];

        // ==================== CHARGEMENT ====================
        function loadData() {
            const savedUser = localStorage.getItem('floy_user');
            if (savedUser) {
                currentUser = { ...currentUser, ...JSON.parse(savedUser) };
            }
            
            const savedPosts = localStorage.getItem('floy_posts');
            if (savedPosts) {
                posts = JSON.parse(savedPosts);
            } else {
                posts = [
                    { id: 1, userId: 1, username: "floy_user", avatar: "F", type: "photo", mediaUrl: "https://picsum.photos/600/500?random=1", caption: "Bienvenue sur Floy ! 🔥", likes: 124, liked: false, comments: [], timestamp: Date.now() - 3600000 },
                    { id: 2, userId: 2, username: "artiste_orange", avatar: "A", type: "photo", mediaUrl: "https://picsum.photos/600/500?random=2", caption: "L'orange et le noir, un duo parfait !", likes: 89, liked: false, comments: [], timestamp: Date.now() - 7200000 }
                ];
                localStorage.setItem('floy_posts', JSON.stringify(posts));
            }
            
            updateSidebar();
        }

        function updateSidebar() {
            document.getElementById('sidebarAvatar').innerHTML = currentUser.avatar;
            document.getElementById('sidebarUsername').innerHTML = currentUser.username;
            document.getElementById('sidebarName').innerHTML = currentUser.fullname;
        }

        // ==================== STORIES ====================
        let stories = [];

        function renderStories() {
            const container = document.getElementById('stories');
            if (!container) return;
            
            container.innerHTML = `
                <div class="story-ring" onclick="alert('📸 Créer une story - Bientôt disponible')">
                    <div class="story-avatar">
                        <div class="story-avatar-inner">📸</div>
                        <div class="story-plus-icon">+</div>
                    </div>
                    <div class="story-username">Votre story</div>
                </div>
                <div class="story-ring" onclick="alert('📖 Story de artiste_orange')">
                    <div class="story-avatar has-story">
                        <div class="story-avatar-inner">A</div>
                    </div>
                    <div class="story-username">artiste_orange</div>
                </div>
                <div class="story-ring" onclick="alert('📖 Story de photographe')">
                    <div class="story-avatar has-story">
                        <div class="story-avatar-inner">P</div>
                    </div>
                    <div class="story-username">photographe</div>
                </div>
            `;
        }

        // ==================== FEED ====================
        function renderFeed() {
            const container = document.getElementById('feed-container');
            if (!container) return;
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="loader">📸 Aucune publication</div>';
                return;
            }
            
            const sorted = [...posts].sort((a,b) => b.timestamp - a.timestamp);
            
            container.innerHTML = sorted.map(post => `
                <div class="post" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-user" onclick="goToUserProfile(${post.userId})">
                            <div class="post-avatar">${post.avatar}</div>
                            <div class="post-username">${post.username}</div>
                        </div>
                        <button class="post-more" onclick="showPostOptions(${post.id})">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><circle cx="5" cy="12" r="2.5"/></svg>
                        </button>
                    </div>
                    
                    <div class="post-image-container" onclick="window.open('${post.mediaUrl}', '_blank')">
                        ${post.type === 'video' ? `<video class="post-video" src="${post.mediaUrl}" controls></video>` : `<img class="post-image" src="${post.mediaUrl}">`}
                    </div>
                    
                    <div class="post-actions">
                        <button class="action-btn like-btn ${post.liked ? 'liked' : ''}" onclick="handleLike(event, ${post.id})">
                            <svg viewBox="0 0 24 24">
                                <path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938Z"/>
                            </svg>
                        </button>
                        <button class="action-btn" onclick="openCommentsModal(${post.id})">
                            <svg viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/></svg>
                        </button>
                        <button class="action-btn" onclick="sharePost(${post.id})">
                            <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3l9 9-9 9"/></svg>
                        </button>
                        <button class="action-btn save-btn" onclick="alert('🔖 Post sauvegardé')">
                            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16z"/></svg>
                        </button>
                    </div>
                    
                    <div class="post-likes" id="likes-${post.id}">${post.likes} ${post.likes === 1 ? 'like' : 'likes'}</div>
                    <div class="post-caption"><strong>${post.username}</strong> ${escapeHtml(post.caption)}</div>
                    <div class="post-comments" onclick="openCommentsModal(${post.id})">${post.comments?.length === 0 ? "Soyez le premier à commenter" : `Voir les ${post.comments?.length || 0} commentaires`}</div>
                    <div class="post-time">il y a ${getTimeAgo(post.timestamp)}</div>
                    
                    <div class="comment-form">
                        <input type="text" class="comment-input" id="comment-input-${post.id}" placeholder="Ajouter un commentaire..." onkeypress="if(event.key==='Enter') addQuickComment(${post.id})">
                        <button class="comment-post-btn" onclick="addQuickComment(${post.id})">Publier</button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== LIKES ====================
        function handleLike(event, postId) {
            event.stopPropagation();
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const btn = event.currentTarget;
            
            if (post.liked) {
                post.likes--;
                post.liked = false;
                btn.classList.remove('liked');
            } else {
                post.likes++;
                post.liked = true;
                btn.classList.add('liked');
                btn.style.transform = 'scale(1.2)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
                
                // Animation cœur
                const rect = btn.getBoundingClientRect();
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.cssText = `position:fixed;left:${rect.left + rect.width/2 - 16}px;top:${rect.top + rect.height/2 - 16}px;font-size:32px;pointer-events:none;z-index:9999;animation:heartExplode 0.6s ease-out forwards;`;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 600);
            }
            
            const likesSpan = document.getElementById(`likes-${postId}`);
            if (likesSpan) likesSpan.textContent = `${post.likes} ${post.likes === 1 ? 'like' : 'likes'}`;
            
            localStorage.setItem('floy_posts', JSON.stringify(posts));
        }

        // ==================== COMMENTAIRES ====================
        function addQuickComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            
            const post = posts.find(p => p.id === postId);
            if (post) {
                if (!post.comments) post.comments = [];
                post.comments.push({
                    username: currentUser.username,
                    text: text,
                    avatar: currentUser.avatar
                });
                input.value = '';
                
                const commentsDiv = document.querySelector(`.post[data-post-id="${postId}"] .post-comments`);
                if (commentsDiv) {
                    commentsDiv.textContent = `Voir les ${post.comments.length} commentaires`;
                }
                localStorage.setItem('floy_posts', JSON.stringify(posts));
            }
        }

        function openCommentsModal(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const modal = document.createElement('div');
            modal.className = 'comments-modal';
            modal.innerHTML = `
                <div class="comments-modal-content">
                    <div class="comments-modal-header">
                        <h3>Commentaires (${post.comments?.length || 0})</h3>
                        <button onclick="this.closest('.comments-modal').remove()">&times;</button>
                    </div>
                    <div class="comments-list">
                        ${post.comments?.map(c => `
                            <div class="comment-item">
                                <div class="comment-avatar">${c.avatar || c.username.charAt(0)}</div>
                                <div class="comment-content">
                                    <div class="comment-username">${c.username}</div>
                                    <div class="comment-text">${escapeHtml(c.text)}</div>
                                </div>
                            </div>
                        `).join('') || '<div style="text-align:center;padding:40px;color:#8e8e8e;">Aucun commentaire</div>'}
                    </div>
                    <div class="comments-footer">
                        <input type="text" id="modalCommentInput" placeholder="Ajouter un commentaire...">
                        <button onclick="addModalComment(${postId})">Publier</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function addModalComment(postId) {
            const input = document.getElementById('modalCommentInput');
            const text = input?.value.trim();
            if (!text) return;
            
            const post = posts.find(p => p.id === postId);
            if (post) {
                if (!post.comments) post.comments = [];
                post.comments.push({
                    username: currentUser.username,
                    text: text,
                    avatar: currentUser.avatar
                });
                localStorage.setItem('floy_posts', JSON.stringify(posts));
                document.querySelector('.comments-modal')?.remove();
                renderFeed();
            }
        }

        // ==================== PARTAGE ====================
        function sharePost(postId) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:5000;display:flex;align-items:center;justify-content:center;';
            modal.innerHTML = `
                <div style="background:#000;border-radius:16px;width:350px;border:1px solid #262626;">
                    <div style="padding:16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;">
                        <h3>Partager</h3>
                        <button onclick="this.closest('div').parentElement.remove()" style="background:none;border:none;color:#fff;font-size:24px;">&times;</button>
                    </div>
                    <div style="padding:16px;">
                        <button onclick="navigator.clipboard.writeText(window.location.href); alert('Lien copié !'); this.closest('div').parentElement.remove()" style="width:100%;background:#1a1a1a;border:none;padding:12px;border-radius:8px;color:#fff;margin-bottom:8px;cursor:pointer;">🔗 Copier le lien</button>
                        <button onclick="window.open('https://wa.me/?text='+encodeURIComponent('Regarde ce post sur Floy ! '+window.location.href),'_blank'); this.closest('div').parentElement.remove()" style="width:100%;background:#1a1a1a;border:none;padding:12px;border-radius:8px;color:#fff;margin-bottom:8px;cursor:pointer;">💬 WhatsApp</button>
                        <button onclick="window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('Regarde ce post sur Floy ! 🔥'),'_blank'); this.closest('div').parentElement.remove()" style="width:100%;background:#1a1a1a;border:none;padding:12px;border-radius:8px;color:#fff;cursor:pointer;">🐦 X (Twitter)</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // ==================== UPLOAD ====================
        function openUploadModal() {
            let selectedFile = null;
            let selectedType = 'photo';
            
            const modal = document.createElement('div');
            modal.className = 'modal-upload';
            modal.innerHTML = `
                <div class="modal-upload-content">
                    <div class="modal-upload-header">
                        <h3>Créer une publication</h3>
                        <button onclick="this.closest('.modal-upload').remove()">&times;</button>
                    </div>
                    <div class="modal-upload-body">
                        <div id="uploadArea" style="text-align:center;padding:40px;border:2px dashed #262626;border-radius:12px;cursor:pointer;" onclick="document.getElementById('uploadFileInput').click()">
                            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/>
                            </svg>
                            <p>Sélectionnez une photo</p>
                            <button>Parcourir</button>
                        </div>
                        <div id="uploadPreview" style="display:none;">
                            <img id="previewImage" style="max-width:100%;max-height:250px;border-radius:12px;margin-bottom:16px;">
                            <textarea id="uploadCaption" placeholder="Écrivez une légende..." rows="3" style="width:100%;background:#1a1a1a;border:1px solid #262626;border-radius:8px;padding:12px;color:#fff;margin-bottom:16px;resize:none;"></textarea>
                            <button id="publishBtn" style="width:100%;background:#FF6B35;border:none;padding:12px;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;">Publier</button>
                        </div>
                        <input type="file" id="uploadFileInput" accept="image/*" style="display:none;">
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('uploadFileInput').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        document.getElementById('previewImage').src = ev.target.result;
                        document.getElementById('uploadArea').style.display = 'none';
                        document.getElementById('uploadPreview').style.display = 'block';
                        selectedFile = { file, dataUrl: ev.target.result };
                    };
                    reader.readAsDataURL(file);
                }
            };
            
            document.getElementById('publishBtn').onclick = () => {
                if (!selectedFile) { alert("Sélectionnez un fichier"); return; }
                const caption = document.getElementById('uploadCaption').value;
                const newPost = {
                    id: Date.now(),
                    userId: currentUser.id,
                    username: currentUser.username,
                    avatar: currentUser.avatar,
                    type: 'photo',
                    mediaUrl: selectedFile.dataUrl,
                    caption: caption || '',
                    likes: 0,
                    liked: false,
                    comments: [],
                    timestamp: Date.now()
                };
                posts.unshift(newPost);
                localStorage.setItem('floy_posts', JSON.stringify(posts));
                modal.remove();
                renderFeed();
                alert("✅ Publication envoyée !");
            };
        }

        // ==================== NOTIFICATIONS ====================
        function openNotificationsModal() {
            const modal = document.createElement('div');
            modal.className = 'comments-modal';
            modal.innerHTML = `
                <div class="comments-modal-content">
                    <div class="comments-modal-header">
                        <h3>Notifications</h3>
                        <button onclick="this.closest('.comments-modal').remove()">&times;</button>
                    </div>
                    <div class="comments-list" style="text-align:center;padding:40px;color:#8e8e8e;">
                        🔔 Aucune notification pour le moment
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // ==================== NAVIGATION ====================
        function goToProfile() { window.location.href = 'profil.html'; }
        function goToUserProfile(id) { if(id === currentUser.id) goToProfile(); else alert(`👤 Profil utilisateur #${id}`); }
        function showPostOptions(id) { if(confirm('Supprimer cette publication ?')) { posts = posts.filter(p => p.id !== id); localStorage.setItem('floy_posts', JSON.stringify(posts)); renderFeed(); } }

        // ==================== SUGGESTIONS ====================
        function setupSuggestions() {
            const container = document.getElementById('suggestionsList');
            if (container) {
                container.innerHTML = `
                    <div class="suggestion-item" onclick="alert('Profil de artiste_orange')">
                        <div class="suggestion-avatar">A</div>
                        <div class="suggestion-info">
                            <div class="username">artiste_orange</div>
                            <div class="followers">12k abonnés</div>
                        </div>
                        <button class="follow-btn">Suivre</button>
                    </div>
                    <div class="suggestion-item" onclick="alert('Profil de photographe')">
                        <div class="suggestion-avatar">P</div>
                        <div class="suggestion-info">
                            <div class="username">photographe</div>
                            <div class="followers">8.5k abonnés</div>
                        </div>
                        <button class="follow-btn">Suivre</button>
                    </div>
                `;
            }
        }

        // ==================== NAVIGATION SIDEBAR ====================
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    
                    if (page === 'profile') window.location.href = 'profil.html';
                    else if (page === 'settings') window.location.href = 'settings.html';
                    else if (page === 'explore') window.location.href = 'explore.html';
                    else if (page === 'reels') window.location.href = 'reels.html';
                    else if (page === 'messages') window.location.href = 'messages.html';
                    else if (page === 'create') { openUploadModal(); item.classList.remove('active'); document.querySelector('.nav-item[data-page="feed"]').classList.add('active'); }
                    else if (page === 'notifications') openNotificationsModal();
                    else if (page === 'feed') { renderFeed(); renderStories(); }
                    else alert(`📱 Page ${page} - Bientôt disponible`);
                });
            });
        }

        // ==================== UTILITAIRES ====================
        function getTimeAgo(timestamp) {
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "à l'instant";
            if (diff < 3600) return `${Math.floor(diff/60)} min`;
            if (diff < 86400) return `${Math.floor(diff/3600)} h`;
            return `${Math.floor(diff/86400)} j`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
        }

        // ==================== INIT ====================
        function init() {
            loadData();
            renderFeed();
            renderStories();
            setupSuggestions();
            setupNavigation();
        }
        
        init();
    </script>
</body>
</html>
