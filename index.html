<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Partagez vos moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: 100vh;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Sidebar gauche */
        .sidebar {
            width: 244px;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            background: #000000;
            border-right: 1px solid #262626;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 25px 12px 16px;
            margin-bottom: 20px;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B35, #FF9F5C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-nav {
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #f5f5f5;
        }

        .nav-item:hover {
            background: #1a1a1a;
        }

        .nav-item.active {
            font-weight: 600;
            color: #FF6B35;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
        }

        .nav-item.active svg {
            stroke: #FF6B35;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #262626;
        }

        /* Main content */
        .main-content {
            margin-left: 244px;
            flex: 1;
            max-width: 630px;
            padding: 0 20px;
        }

        /* Stories */
        .stories-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 16px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #262626;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .story-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .story-avatar.has-story {
            background: linear-gradient(45deg, #FF6B35, #FF9F5C);
        }

        .story-avatar-inner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            overflow: hidden;
        }

        .story-avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-username {
            font-size: 12px;
            color: #8e8e8e;
        }

        .create-story-btn {
            background: #FF6B35;
            border: none;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 4px;
        }

        /* Post card */
        .post {
            margin-bottom: 20px;
            background: #000000;
            border: 1px solid #262626;
            border-radius: 8px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            overflow: hidden;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-more {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .post-more svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #f5f5f5;
        }

        .post-image-container {
            width: 100%;
            background: #1a1a1a;
            cursor: pointer;
        }

        .post-image {
            width: 100%;
            display: block;
        }

        .post-video {
            width: 100%;
            max-height: 500px;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #f5f5f5;
            stroke-width: 1.5;
        }

        .action-btn.liked svg {
            fill: #FF6B35;
            stroke: #FF6B35;
        }

        .save-btn {
            margin-left: auto;
        }

        .post-likes {
            font-weight: 600;
            font-size: 14px;
            padding: 0 16px 8px;
            cursor: pointer;
        }

        .post-caption {
            padding: 0 16px 8px;
            font-size: 14px;
        }

        .post-caption strong {
            font-weight: 600;
            margin-right: 6px;
            cursor: pointer;
        }

        .post-comments {
            padding: 0 16px 4px;
            font-size: 14px;
            color: #8e8e8e;
            cursor: pointer;
        }

        .post-time {
            padding: 4px 16px 12px;
            font-size: 10px;
            color: #8e8e8e;
        }

        .comment-form {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid #262626;
        }

        .comment-input {
            flex: 1;
            background: none;
            border: none;
            color: #f5f5f5;
            padding: 12px 0;
            font-size: 14px;
            outline: none;
        }

        .comment-input::placeholder {
            color: #8e8e8e;
        }

        .comment-post-btn {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.7;
        }

        .comment-post-btn.active {
            opacity: 1;
        }

        /* Modal commentaires */
        .comments-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .comments-modal.active {
            display: flex;
        }

        .comments-modal-content {
            background: #000000;
            border-radius: 16px;
            width: 400px;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            border: 1px solid #262626;
        }

        .comments-modal-header {
            padding: 16px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comments-modal-header h3 {
            font-size: 16px;
        }

        .comments-modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .comment-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .comment-content {
            flex: 1;
        }

        .comment-username {
            font-weight: 600;
            font-size: 13px;
        }

        .comment-text {
            font-size: 13px;
            margin-top: 4px;
        }

        /* Right sidebar */
        .right-sidebar {
            width: 320px;
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            padding: 30px 20px;
            display: block;
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info .username {
            font-weight: 600;
            font-size: 14px;
        }

        .user-info .name {
            font-size: 12px;
            color: #8e8e8e;
        }

        .suggestions-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: #8e8e8e;
            font-size: 14px;
        }

        .see-all {
            background: none;
            border: none;
            color: #f5f5f5;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .suggestion-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FF6B35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .suggestion-info .username {
            font-weight: 600;
            font-size: 14px;
        }

        .suggestion-info .followers {
            font-size: 12px;
            color: #8e8e8e;
        }

        .follow-btn {
            background: none;
            border: none;
            color: #FF6B35;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            margin-left: auto;
        }

        /* Modal création post */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #000000;
            border-radius: 16px;
            width: 500px;
            max-width: 90%;
            border: 1px solid #262626;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .upload-area {
            text-align: center;
            padding: 40px;
            border: 2px dashed #262626;
            border-radius: 12px;
            cursor: pointer;
        }

        .upload-area svg {
            color: #8e8e8e;
            margin-bottom: 16px;
        }

        .upload-area p {
            color: #8e8e8e;
            margin-bottom: 16px;
        }

        .upload-area button {
            background: #FF6B35;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .media-type-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .media-type-btn {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #262626;
            padding: 10px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .media-type-btn.active {
            background: #FF6B35;
            border-color: #FF6B35;
        }

        #previewContainer {
            text-align: center;
        }

        #previewImage, #previewVideo {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        #previewVideo {
            width: 100%;
        }

        #postCaption {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            color: white;
            margin-bottom: 16px;
            resize: none;
        }

        #publishBtn {
            background: #FF6B35;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* Modal story */
        .story-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }

        .story-modal.active {
            display: flex;
        }

        .story-viewer {
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .story-viewer img, .story-viewer video {
            width: 100%;
            border-radius: 16px;
            max-height: 80vh;
            object-fit: contain;
        }

        .story-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .story-progress {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }

        .story-progress-bar {
            height: 100%;
            background: #FF6B35;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .loader {
            text-align: center;
            padding: 60px;
            color: #8e8e8e;
        }

        /* Responsive */
        @media (max-width: 1260px) {
            .right-sidebar {
                display: none;
            }
            .main-content {
                max-width: 100%;
            }
        }

        @media (max-width: 1000px) {
            .sidebar {
                width: 72px;
            }
            .sidebar .logo-text,
            .sidebar .nav-item span {
                display: none;
            }
            .main-content {
                margin-left: 72px;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- SIDEBAR GAUCHE -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="1.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span class="logo-text">Floy</span>
            </div>

            <nav class="sidebar-nav">
                <!-- Accueil -->
                <div class="nav-item active" data-page="feed">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 23h-6.001a1 1 0 0 1-1-1v-5.455a2.997 2.997 0 1 0-5.993 0V22a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11.543a1.002 1.002 0 0 1 .31-.724l8.122-7.351a2.999 2.999 0 0 1 4.09-.043L22.7 10.82a1 1 0 0 1 .3.724V22a1 1 0 0 1-1 1Z"/>
                    </svg>
                    <span>Accueil</span>
                </div>

                <!-- Explorer -->
                <div class="nav-item" data-page="explore">
                    <svg viewBox="0 0 24 24">
                        <path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm-8.5 6.5a8.5 8.5 0 1 1 17 0 8.5 8.5 0 0 1-17 0Z"/>
                        <path d="M19.53 19.53l-4.16-4.16a.75.75 0 0 1 1.06-1.06l4.16 4.16a.75.75 0 0 1-1.06 1.06Z"/>
                    </svg>
                    <span>Explorer</span>
                </div>

                <!-- Reels -->
                <div class="nav-item" data-page="reels">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.5 5.5h19v13h-19z"/>
                        <path d="M9.5 8.5l6 3.5-6 3.5z"/>
                    </svg>
                    <span>Reels</span>
                </div>

                <!-- Créer un post -->
                <div class="nav-item" data-page="create">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/>
                    </svg>
                    <span>Créer</span>
                </div>

                <!-- Notifications (cloche) -->
                <div class="nav-item" data-page="notifications">
                    <svg viewBox="0 0 24 24">
                        <path d="M16.5 18.5v-5.5a4.5 4.5 0 0 0-9 0v5.5H5v-5.5a6 6 0 1 1 12 0v5.5h-2.5Z"/>
                        <path d="M8.5 18.5h-2v-5.5a4.5 4.5 0 0 1 9 0v5.5h-2"/>
                        <path d="M9 20.5h6"/>
                    </svg>
                    <span>Notifications</span>
                </div>

                <!-- Profil -->
                <div class="nav-item" data-page="profile">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.417 8.11.75.75 0 1 1-1.5.086 7.5 7.5 0 0 0-14.026 0 .75.75 0 1 1-1.5-.086 9.005 9.005 0 0 1 5.417-8.11A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/>
                    </svg>
                    <span>Profil</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <!-- Paramètres -->
                <div class="nav-item" data-page="settings">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="2.5"/>
                        <path d="M18.37 7.29l1.06-1.06a1.5 1.5 0 0 0-2.12-2.12L15.7 6.12a7.5 7.5 0 0 0-7.4 0L6.69 4.11a1.5 1.5 0 1 0-2.12 2.12l1.06 1.06a7.5 7.5 0 0 0 0 7.4l-1.06 1.06a1.5 1.5 0 0 0 2.12 2.12l1.06-1.06a7.5 7.5 0 0 0 7.4 0l1.06 1.06a1.5 1.5 0 0 0 2.12-2.12l-1.06-1.06a7.5 7.5 0 0 0 0-7.4z"/>
                    </svg>
                    <span>Paramètres</span>
                </div>
            </div>
        </aside>

        <!-- CONTENU PRINCIPAL -->
        <main class="main-content">
            <!-- Stories -->
            <div class="stories-container" id="stories"></div>
            
            <!-- Feed -->
            <div id="feed-container"></div>
        </main>

        <!-- SIDEBAR DROITE -->
        <aside class="right-sidebar">
            <div class="current-user" id="currentUserSidebar" onclick="goToProfile()">
                <div class="user-avatar" id="sidebarAvatar">F</div>
                <div class="user-info">
                    <div class="username" id="sidebarUsername">floy_user</div>
                    <div class="name" id="sidebarName">Floy Creator</div>
                </div>
            </div>
            <div class="suggestions-header">
                <span>Suggestions</span>
                <button class="see-all">Voir tout</button>
            </div>
            <div class="suggestions-list" id="suggestionsList"></div>
        </aside>
    </div>

    <!-- MODAL CRÉATION POST -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Créer une nouvelle publication</h3>
                <button class="modal-close" onclick="closeCreateModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="media-type-selector">
                    <button class="media-type-btn active" onclick="selectMediaType('photo')">📷 Photo</button>
                    <button class="media-type-btn" onclick="selectMediaType('video')">🎬 Vidéo</button>
                </div>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/>
                    </svg>
                    <p>Glissez une photo ou vidéo ici</p>
                    <button type="button">Sélectionner depuis l'ordinateur</button>
                </div>
                <div id="previewContainer" style="display: none;">
                    <img id="previewImage" src="" style="display: none;">
                    <video id="previewVideo" controls style="display: none;"></video>
                    <textarea id="postCaption" placeholder="Écrivez une légende..." rows="3"></textarea>
                    <button id="publishBtn" onclick="publishPost()">Publier</button>
                </div>
                <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
            </div>
        </div>
    </div>

    <!-- MODAL STORY -->
    <div id="storyModal" class="story-modal">
        <div class="story-viewer">
            <div class="story-progress">
                <div class="story-progress-bar" id="storyProgress"></div>
            </div>
            <button class="story-close" onclick="closeStoryModal()">&times;</button>
            <div id="storyContent"></div>
        </div>
    </div>

    <!-- MODAL COMMENTAIRES -->
    <div id="commentsModal" class="comments-modal">
        <div class="comments-modal-content">
            <div class="comments-modal-header">
                <h3>Commentaires</h3>
                <button class="comments-modal-close" onclick="closeCommentsModal()">&times;</button>
            </div>
            <div class="comments-list" id="commentsList"></div>
        </div>
    </div>

    <script>
        // ========== DONNÉES ==========
        let currentUser = {
            id: 1,
            username: "floy_user",
            fullname: "Floy Creator",
            avatar: "F",
            avatarUrl: null,
            bio: "Créateur de Floy 🔥",
            followers: 128,
            following: 94
        };

        let posts = [];
        let stories = [];
        let currentMediaType = 'photo';

        // ========== INITIALISATION ==========
        function init() {
            loadData();
            setupNavigation();
            updateSidebar();
            renderStories();
            renderFeed();
            setupSuggestions();
        }

        // ========== CHARGEMENT DONNÉES ==========
        function loadData() {
            const savedUser = localStorage.getItem('floy_user');
            if (savedUser) {
                currentUser = { ...currentUser, ...JSON.parse(savedUser) };
            }

            const savedPosts = localStorage.getItem('floy_posts');
            if (savedPosts) {
                posts = JSON.parse(savedPosts);
            } else {
                // Posts de test
                posts = [
                    {
                        id: 1,
                        userId: 1,
                        username: "floy_user",
                        avatar: "F",
                        avatarUrl: null,
                        type: "photo",
                        mediaUrl: "https://picsum.photos/600/500?random=1",
                        caption: "Bienvenue sur Floy ! Le réseau social orange et noir 🔥",
                        likes: 124,
                        liked: false,
                        comments: [{ username: "visiteur1", text: "Superbe plateforme !", avatar: "V" }],
                        timestamp: Date.now() - 2 * 60 * 60 * 1000
                    },
                    {
                        id: 2,
                        userId: 2,
                        username: "artiste_orange",
                        avatar: "A",
                        avatarUrl: null,
                        type: "photo",
                        mediaUrl: "https://picsum.photos/600/500?random=2",
                        caption: "L'orange et le noir, un duo parfait !",
                        likes: 89,
                        liked: false,
                        comments: [{ username: "fan_art", text: "Magnifique !", avatar: "F" }],
                        timestamp: Date.now() - 5 * 60 * 60 * 1000
                    }
                ];
                savePosts();
            }

            const savedStories = localStorage.getItem('floy_stories');
            if (savedStories) {
                stories = JSON.parse(savedStories);
                // Supprimer les stories de plus de 24h
                stories = stories.filter(s => Date.now() - s.timestamp < 24 * 60 * 60 * 1000);
                saveStories();
            }
        }

        function savePosts() {
            localStorage.setItem('floy_posts', JSON.stringify(posts));
        }

        function saveStories() {
            localStorage.setItem('floy_stories', JSON.stringify(stories));
        }

        function updateSidebar() {
            document.getElementById('sidebarAvatar').innerHTML = currentUser.avatarUrl ? 
                `<img src="${currentUser.avatarUrl}">` : currentUser.avatar;
            document.getElementById('sidebarUsername').textContent = currentUser.username;
            document.getElementById('sidebarName').textContent = currentUser.fullname;
        }

        // ========== RENDU STORIES ==========
        function renderStories() {
            const container = document.getElementById('stories');
            
            // Filter stories valides
            const validStories = stories.filter(s => Date.now() - s.timestamp < 24 * 60 * 60 * 1000);
            
            container.innerHTML = `
                <div class="story" onclick="openCreateStoryModal()">
                    <div class="story-avatar has-story">
                        <div class="story-avatar-inner">
                            ${currentUser.avatarUrl ? `<img src="${currentUser.avatarUrl}">` : '📸'}
                        </div>
                    </div>
                    <div class="story-username">Votre story</div>
                    <button class="create-story-btn">+ Créer</button>
                </div>
            `;
            
            // Ajouter les stories des autres utilisateurs
            const otherStories = validStories.filter(s => s.userId !== currentUser.id);
            const uniqueUsers = [...new Map(otherStories.map(s => [s.userId, s])).values()];
            
            uniqueUsers.forEach(story => {
                container.innerHTML += `
                    <div class="story" onclick="viewStory(${story.userId})">
                        <div class="story-avatar has-story">
                            <div class="story-avatar-inner">
                                ${story.avatarUrl ? `<img src="${story.avatarUrl}">` : story.avatar}
                            </div>
                        </div>
                        <div class="story-username">${story.username}</div>
                    </div>
                `;
            });
        }

        // ========== RENDU FEED ==========
        function renderFeed() {
            const container = document.getElementById('feed-container');
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="loader">📸 Aucune publication<br><small>Soyez le premier à partager !</small></div>';
                return;
            }
            
            // Trier par date décroissante
            const sortedPosts = [...posts].sort((a, b) => b.timestamp - a.timestamp);
            
            container.innerHTML = sortedPosts.map(post => renderPost(post)).join('');
        }

        function renderPost(post) {
            const timeAgo = getTimeAgo(post.timestamp);
            const isLiked = post.liked || false;
            
            return `
                <article class="post" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-user" onclick="goToUserProfile(${post.userId})">
                            <div class="post-avatar">
                                ${post.avatarUrl ? `<img src="${post.avatarUrl}">` : post.avatar}
                            </div>
                            <div class="post-username">${post.username}</div>
                        </div>
                        <button class="post-more" onclick="showPostOptions(${post.id})">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="2.5"/>
                                <circle cx="19" cy="12" r="2.5"/>
                                <circle cx="5" cy="12" r="2.5"/>
                            </svg>
                        </button>
                    </div>

                    <div class="post-image-container" onclick="viewMedia('${post.mediaUrl}')">
                        ${post.type === 'video' ? 
                            `<video class="post-video" src="${post.mediaUrl}" controls></video>` : 
                            `<img class="post-image" src="${post.mediaUrl}" alt="Post">`
                        }
                    </div>

                    <div class="post-actions">
                        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" onclick="handleLike(event, ${post.id})">
                            <svg viewBox="0 0 24 24">
                                <path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.141 14.072 2.5 12.167 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938Z"/>
                            </svg>
                        </button>
                        <button class="action-btn comment-btn" onclick="focusCommentInput(${post.id})">
                            <svg viewBox="0 0 24 24">
                                <path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"/>
                            </svg>
                        </button>
                        <button class="action-btn share-btn" onclick="sharePost(${post.id})">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 12h18M12 3l9 9-9 9"/>
                            </svg>
                        </button>
                        <button class="action-btn save-btn" onclick="savePost(${post.id})">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 21l-7-5-7 5V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="post-likes" onclick="showLikers(${post.id})">
                        ${post.likes} ${post.likes === 1 ? 'like' : 'likes'}
                    </div>

                    <div class="post-caption">
                        <strong onclick="goToUserProfile(${post.userId})">${post.username}</strong>
                        <span>${escapeHtml(post.caption)}</span>
                    </div>

                    <div class="post-comments" onclick="viewAllComments(${post.id})">
                        ${post.comments.length > 0 ? `Voir les ${post.comments.length} commentaires` : 'Soyez le premier à commenter'}
                    </div>

                    <div class="post-time">
                        il y a ${timeAgo}
                    </div>

                    <div class="comment-form">
                        <input type="text" class="comment-input" id="comment-input-${post.id}" placeholder="Ajouter un commentaire..." onkeypress="handleCommentKeypress(event, ${post.id})">
                        <button class="comment-post-btn" onclick="addComment(${post.id})">Publier</button>
                    </div>
                </article>
            `;
        }

        // ========== GESTION LIKES ==========
        function handleLike(event, postId) {
            event.stopPropagation();
            const post = posts.find(p => p.id === postId);
            if (!post) return;
            
            const btn = event.currentTarget;
            
            if (post.liked) {
                post.likes--;
                post.liked = false;
                btn.classList.remove('liked');
            } else {
                post.likes++;
                post.liked = true;
                btn.classList.add('liked');
                btn.style.transform = 'scale(1.2)';
                setTimeout(() => { btn.style.transform = ''; }, 200);
            }
            
            // Mettre à jour l'affichage
            const likesDiv = btn.closest('.post').querySelector('.post-likes');
            if (likesDiv) {
                likesDiv.textContent = `${post.likes} ${post.likes === 1 ? 'like' : 'likes'}`;
            }
            
            savePosts();
        }

        // ========== GESTION COMMENTAIRES ==========
        function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.comments.push({
                    username: currentUser.username,
                    text: text,
                    avatar: currentUser.avatar,
                    avatarUrl: currentUser.avatarUrl
                });
                input.value = '';
                
                // Mettre à jour l'affichage
                const commentsDiv = document.querySelector(`.post[data-post-id="${postId}"] .post-comments`);
                if (commentsDiv) {
                    commentsDiv.textContent = `Voir les ${post.comments.length} commentaires`;
                }
                
                savePosts();
            }
        }

        function viewAllComments(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post || post.comments.length === 0) return;
            
            const modal = document.getElementById('commentsModal');
            const list = document.getElementById('commentsList');
            
            list.innerHTML = post.comments.map(comment => `
                <div class="comment-item">
                    <div class="comment-avatar">
                        ${comment.avatarUrl ? `<img src="${comment.avatarUrl}">` : (comment.avatar || comment.username.charAt(0).toUpperCase())}
                    </div>
                    <div class="comment-content">
                        <div class="comment-username">${comment.username}</div>
                        <div class="comment-text">${escapeHtml(comment.text)}</div>
                    </div>
                </div>
            `).join('');
            
            modal.classList.add('active');
        }

        function closeCommentsModal() {
            document.getElementById('commentsModal').classList.remove('active');
        }

        function focusCommentInput(postId) {
            document.getElementById(`comment-input-${postId}`).focus();
        }

        function handleCommentKeypress(event, postId) {
            if (event.key === 'Enter') {
                addComment(postId);
            }
        }

        // ========== GESTION STORIES ==========
        function openCreateStoryModal() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const newStory = {
                            id: Date.now(),
                            userId: currentUser.id,
                            username: currentUser.username,
                            avatar: currentUser.avatar,
                            avatarUrl: currentUser.avatarUrl,
                            type: file.type.startsWith('video') ? 'video' : 'photo',
                            mediaUrl: event.target.result,
                            timestamp: Date.now()
                        };
                        stories.push(newStory);
                        saveStories();
                        renderStories();
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function viewStory(userId) {
            const userStories = stories.filter(s => s.userId === userId);
            if (userStories.length === 0) return;
            
            let currentIndex = 0;
            const modal = document.getElementById('storyModal');
            const content = document.getElementById('storyContent');
            const progressBar = document.getElementById('storyProgress');
            
            function showStory(index) {
                const story = userStories[index];
                content.innerHTML = story.type === 'video' ?
                    `<video src="${story.mediaUrl}" autoplay style="width:100%;border-radius:16px;"></video>` :
                    `<img src="${story.mediaUrl}" style="width:100%;border-radius:16px;">`;
                
                progressBar.style.width = '0%';
                let width = 0;
                const interval = setInterval(() => {
                    width += 2;
                    progressBar.style.width = width + '%';
                    if (width >= 100) {
                        clearInterval(interval);
                        if (index + 1 < userStories.length) {
                            showStory(index + 1);
                        } else {
                            closeStoryModal();
                        }
                    }
                }, 50);
                
                content.onclick = () => {
                    clearInterval(interval);
                    if (index + 1 < userStories.length) {
                        showStory(index + 1);
                    } else {
                        closeStoryModal();
                    }
                };
            }
            
            modal.classList.add('active');
            showStory(0);
        }

        function closeStoryModal() {
            document.getElementById('storyModal').classList.remove('active');
            document.getElementById('storyContent').innerHTML = '';
        }

        // ========== CRÉATION POST ==========
        function selectMediaType(type) {
            currentMediaType = type;
            document.querySelectorAll('.media-type-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.media-type-btn[onclick="selectMediaType('${type}')"]`).classList.add('active');
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('postCaption').value = '';
            document.getElementById('previewImage').style.display = 'none';
            document.getElementById('previewVideo').style.display = 'none';
        }

        function publishPost() {
            const previewImage = document.getElementById('previewImage');
            const previewVideo = document.getElementById('previewVideo');
            const caption = document.getElementById('postCaption').value;
            
            let mediaUrl = '';
            if (currentMediaType === 'photo' && previewImage.src) {
                mediaUrl = previewImage.src;
            } else if (currentMediaType === 'video' && previewVideo.src) {
                mediaUrl = previewVideo.src;
            }
            
            if (!mediaUrl) {
                alert('Sélectionnez un média d\'abord !');
                return;
            }
            
            const newPost = {
                id: Date.now(),
                userId: currentUser.id,
                username: currentUser.username,
                avatar: currentUser.avatar,
                avatarUrl: currentUser.avatarUrl,
                type: currentMediaType,
                mediaUrl: mediaUrl,
                caption: caption || 'Nouvelle publication ! 🔥',
                likes: 0,
                liked: false,
                comments: [],
                timestamp: Date.now()
            };
            
            posts.unshift(newPost);
            savePosts();
            renderFeed();
            closeCreateModal();
        }

        // Setup upload
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    if (currentMediaType === 'photo' || file.type.startsWith('image')) {
                        document.getElementById('previewImage').src = event.target.result;
                        document.getElementById('previewImage').style.display = 'block';
                        document.getElementById('previewVideo').style.display = 'none';
                    } else {
                        document.getElementById('previewVideo').src = event.target.result;
                        document.getElementById('previewVideo').style.display = 'block';
                        document.getElementById('previewImage').style.display = 'none';
                    }
                    document.getElementById('uploadArea').style.display = 'none';
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // ========== AUTRES FONCTIONS ==========
        function viewMedia(mediaUrl) {
            window.open(mediaUrl, '_blank');
        }

        function sharePost(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                navigator.clipboard.writeText(post.mediaUrl);
                alert('🔗 Lien copié dans le presse-papier !');
            }
        }

        function savePost(postId) {
            alert('🔖 Post sauvegardé !');
        }

        function showLikers(postId) {
            alert(`❤️ Voir les likes du post #${postId}`);
        }

        function showPostOptions(postId) {
            if (confirm('Supprimer cette publication ?')) {
                posts = posts.filter(p => p.id !== postId);
                savePosts();
                renderFeed();
            }
        }

        function setupSuggestions() {
            const suggestions = [
                { username: "artiste_orange", avatar: "A", followers: "12k" },
                { username: "photographe", avatar: "P", followers: "8.5k" },
                { username: "design_noir", avatar: "D", followers: "5.2k" }
            ];
            
            const container = document.getElementById('suggestionsList');
            container.innerHTML = suggestions.map(s => `
                <div class="suggestion-item" onclick="goToUserProfileByName('${s.username}')">
                    <div class="suggestion-avatar">${s.avatar}</div>
                    <div class="suggestion-info">
                        <div class="username">${s.username}</div>
                        <div class="followers">${s.followers} abonnés</div>
                    </div>
                    <button class="follow-btn" onclick="event.stopPropagation(); followUser('${s.username}')">Suivre</button>
                </div>
            `).join('');
        }

        function followUser(username) {
            alert(`Vous suivez maintenant ${username} !`);
        }

        function goToProfile() {
            window.location.href = 'profil.html';
        }

        function goToUserProfile(userId) {
            if (userId === currentUser.id) {
                goToProfile();
            } else {
                alert(`👤 Profil de l'utilisateur #${userId}`);
            }
        }

        function goToUserProfileByName(username) {
            alert(`👤 Profil de ${username}`);
        }

        // ========== NAVIGATION ==========
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    
                    if (page === 'profile') {
                        window.location.href = 'profil.html';
                    } else if (page === 'settings') {
                        window.location.href = 'settings.html';
                    } else if (page === 'create') {
                        openCreateModal();
                        item.classList.remove('active');
                        document.querySelector('.nav-item[data-page="feed"]').classList.add('active');
                    } else if (page === 'feed') {
                        renderFeed();
                        renderStories();
                    } else {
                        alert(`📱 Page ${page} - Bientôt disponible`);
                    }
                });
            });
        }

        // ========== UTILITAIRES ==========
        function getTimeAgo(timestamp) {
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return "À l'instant";
            if (diff < 3600) return `${Math.floor(diff / 60)} minutes`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} heures`;
            if (diff < 604800) return `${Math.floor(diff / 86400)} jours`;
            return new Date(timestamp).toLocaleDateString();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Fermer modals
        document.getElementById('createModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('createModal')) closeCreateModal();
        });
        
        document.getElementById('storyModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('storyModal')) closeStoryModal();
        });

        // Démarrer
        init();
    </script>
</body>
</html>
