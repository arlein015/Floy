<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Modifier le profil</title>
    <link rel="stylesheet" href="edit-profil.css">
</head>
<body>
    <div class="edit-header">
        <button class="cancel-btn" onclick="goBack()">Annuler</button>
        <h3>Modifier le profil</h3>
        <button class="save-btn" onclick="saveProfile()">Enregistrer</button>
    </div>

    <div class="edit-container">
        <div class="avatar-section" onclick="changeAvatar()">
            <div class="edit-avatar" id="editAvatar">F</div>
            <div class="avatar-overlay">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2.5a.75.75 0 0 1 .75.75v8h8a.75.75 0 0 1 0 1.5h-8v8a.75.75 0 0 1-1.5 0v-8h-8a.75.75 0 0 1 0-1.5h8v-8A.75.75 0 0 1 12 2.5Z"/>
                </svg>
                <span>Changer la photo</span>
            </div>
        </div>

        <div class="edit-field">
            <label>Nom d'utilisateur</label>
            <input type="text" id="editUsername" placeholder="username">
            <p class="field-hint">Dans les 30 jours, vous pourrez demander un autre changement de nom d'utilisateur.</p>
        </div>

        <div class="edit-field">
            <label>Nom complet</label>
            <input type="text" id="editFullname" placeholder="Nom complet">
        </div>

        <div class="edit-field">
            <label>Bio</label>
            <textarea id="editBio" rows="4" placeholder="Votre bio..."></textarea>
            <p class="field-hint" id="bioCounter">0/150</p>
        </div>

        <div class="edit-field">
            <label>Site web</label>
            <input type="text" id="editWebsite" placeholder="https://...">
        </div>

        <div class="edit-field">
            <label>Email</label>
            <input type="email" id="editEmail" placeholder="email@example.com">
        </div>

        <div class="edit-field">
            <label>Téléphone</label>
            <input type="tel" id="editPhone" placeholder="+33...">
        </div>

        <div class="edit-field">
            <label>Genre</label>
            <select id="editGender">
                <option value="">Non précisé</option>
                <option value="homme">Homme</option>
                <option value="femme">Femme</option>
                <option value="autre">Autre</option>
            </select>
        </div>
    </div>

    <div id="avatarModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Modifier la photo</h3>
                <button class="modal-close" onclick="closeAvatarModal()">&times;</button>
            </div>
            <div class="modal-body">
                <button class="avatar-option" onclick="changeAvatarByEmoji()">😊 Changer avec un emoji</button>
                <button class="avatar-option" onclick="changeAvatarByLetter()">🔤 Changer avec une lettre</button>
                <button class="avatar-option avatar-remove" onclick="removeAvatar()">🗑️ Supprimer la photo</button>
            </div>
        </div>
    </div>

    <script src="edit-profil.js"></script>
</body>
</html>
