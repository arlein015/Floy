<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floy - Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #ffffff;
        }
        
        .explore-header {
            position: sticky;
            top: 0;
            background: #000000;
            border-bottom: 1px solid #262626;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
        }
        .explore-header h3 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }
        .explore-item {
            aspect-ratio: 1;
            background: #1a1a1a;
            cursor: pointer;
            overflow: hidden;
        }
        .explore-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .explore-item:hover img {
            transform: scale(1.05);
        }
        
        .loader {
            text-align: center;
            padding: 60px;
            color: #8e8e8e;
        }
    </style>
</head>
<body>
    <div class="explore-header">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <h3>Explorer</h3>
    </div>

    <div class="explore-grid" id="exploreGrid">
        <div class="loader">🔍 Chargement...</div>
    </div>

    <script>
        function loadExplore() {
            const posts = JSON.parse(localStorage.getItem('floy_posts') || '[]');
            const grid = document.getElementById('exploreGrid');
            
            if (posts.length === 0) {
                grid.innerHTML = '<div class="loader" style="grid-column:span 3">📸 Aucune publication à explorer</div>';
                return;
            }
            
            // Mélanger les posts
            const shuffled = [...posts].sort(() => Math.random() - 0.5);
            
            grid.innerHTML = shuffled.map(post => `
                <div class="explore-item" onclick="viewPost(${post.id})">
                    <img src="${post.mediaUrl}" alt="Post">
                </div>
            `).join('');
        }
        
        function viewPost(postId) {
            alert(`📸 Voir le post #${postId}`);
        }
        
        loadExplore();
    </script>
</body>
</html>
